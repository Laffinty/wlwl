name: CI

# 触发条件随工作分支同步更新。此前这里只有 `main`,而 wip 分支的推送**不触发
# 任何 workflow** —— 也就是说 wip 期间的 fmt / clippy / cargo-deny / test /
# conformance 门禁全部处于「没人跑」的状态,只有开 PR 才走一遍。v0.11 期间曾
# 临时把 `wip0.11` 加进下面两个列表,该分支已并入 main 并删除,规则随之撤除。
#
# 若将来还有 wip 分支,同样加进这两个列表(push 侧按**被推**的分支过滤,
# pull_request 侧按**基**分支过滤),收工时记得撤掉。
#
# [v0.11.3] 2026-10-05:`wip0.11.3` 按上述规则加入(M0–M4 收口后要跑一遍
# 全套门禁,而 push 到 wip 分支本身不触发任何 workflow)。⚠ **2026-10-20
# 该分支已并入 main 并删除,规则随之撤除** —— 与 v0.11 时期 `wip0.11` 的
# 处理同款(体例相同:分支一删,下面这两行就摘掉,不留死规则)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# [D13-073] **显式声明本 workflow 需要的最小权限。**
#
# 为什么要显式:下面那个「回读 artifact」的守卫靠 `gh api` 查 artifact 列表,
# 需要 **`actions: read`**。若不声明,就得**依赖仓库默认权限** —— 而仓库
# 默认权限随时可能被改成 read-only / 私有仓库的「最小权限」策略,那时这把
# 守卫会从「artifact 不存在 ⇒ 红」变成「查不动 ⇒ 红」,**同一个红却是两个
# 完全不同的原因**,排查成本全丢。
#
# 声明成显式值之后,权限是**这条 YAML 自己的事实**,不随仓库设置漂移。
#
# ⚠ 声明 `permissions:` 会**收窄** GITHUB_TOKEN:未列出的 scope 全部变成 none。
#   所以这两项必须**逐个核对**过本 workflow 需要什么:
#   - `contents: read` —— actions/checkout 拉代码(必需,收窄它会直接 checkout 失败)
#   - `actions: read`  —— 「回读 artifact」守卫查列表
#   其余步骤都不需要 GITHUB_TOKEN:upload-artifact 用的是 runner 的
#   ACTIONS_RUNTIME_TOKEN、rust-cache 用的是 cache service、cargo-deny 安装
#   只是下载二进制。**本 workflow 不含发布**(release 在独立的 release.yml,
#   `permissions:` 不跨文件生效)。
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # ⚠⚠ **这个 `name:` 就是 main 分支保护规则里的 required status check**
    # (`test (ubuntu-latest / rust pinned)` / `test (macos-latest / rust pinned)` /
    # `test (windows-latest / rust pinned)`)—— 改了它,main 的保护规则会**静默失配**
    # ⇒ PR 永远显示「Expected — Waiting for status to be reported」,且看不出是谁的问题。
    # 改名前先同步更新 main 的分支保护规则。
    name: test (${{ matrix.os }} / rust pinned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # [v1.0 迁移] 规范已独立成仓(`Laffinty/wlwl-spec-v1`),本仓实现的语义
      # 以 **v1.0 规范**为准。码表守卫
      # (`every_registered_code_is_covered_by_the_spec`)直接**读规范文本**,
      # 所以 CI 必须把规范取下来 —— 而且要**钉死**。
      #
      # 为什么钉死不跟 main:规范仓的 main 会动。不钉死的话,规范一改,本仓的
      # CI 读数就跟着漂 —— 而「实现是否合规」这个问题需要**一个**确定的答案。
      # 换规范版本 = 改这一行(与 `impl/Cargo.toml` 的版本守卫同一性质:钉住,
      # 升级时显式改)。
      #
      # ⚠ 规范仓找不到时,守卫会**响亮地失败**(`spec_path()` 直接 panic 并给出
      # 两条取得办法),**不**回落到仓内的 v0.11 规范 —— 回落会让 `E0103` 这类
      # v1.0 才引入的码**不在**检查范围内,读数却是绿的,那是静默削弱。
      #
      # ⚠⚠ `ref` **必须写完整 40 位 SHA**。写缩写(`ea57671`)时,
      # `actions/checkout` 认不出它是提交 —— 它会退化成「当分支 / 标签找」,
      # 于是 fetch 的是 `+refs/heads/ea57671*` 与 `+refs/tags/ea57671*`,
      # 两者都不存在 ⇒ `git fetch` exit 1 ⇒ job 直接红。短形式只用于**人读**。
      #
      # [v0.12.0 / 2026-10-25] 规范仓基线前移到 **v1.0.2**(`ea57671`)。
      # ⚠ 前一版钉的是 `5478cea`(v1.0 时期):该提交的 §5.4 只有 13 行差异登记、
      # 附录 A **不含** `TCP_LISTEN` 等 17 个新公共面成员 ⇒ 实现侧落地新成员后,
      # 「§5.4 状态列双向门禁」与「附录 A 同步守卫」会**同时**红,且无法区分
      # 是新门禁的接线问题还是实现漂移 ⇒ 必须在落地前先前移。
      - name: Checkout 规范仓(钉死提交)
        uses: actions/checkout@v4
        with:
          repository: Laffinty/wlwl-spec-v1
          ref: ea576715bc0f13f1262b55368a7378cc8547c9ab
          path: wlwl-spec-v1

      - name: 指向 v1.0 规范
        shell: bash
        run: echo "WLWL_SPEC_PATH=$GITHUB_WORKSPACE/wlwl-spec-v1/docs/spec/wlwl-v1.0-language.md" >> "$GITHUB_ENV"

      # [2026-10-22] 追加 `WLWL_SPEC_V1_DIR` —— 指向**规范仓的检出目录**
      # (不是某一册文件)。
      #
      # 为什么要它:标准库**附录 A 是 v1.0 的冻结快照**(规范仓注册镜像册
      # §0.7:「表体**不得**由实现清单自动生成」,单源真相是规范自身)⇒ 本仓的
      # 合并册里那一段是**抄件**,不是活镜像。于是本仓的守卫要能回答两个
      # 不同的问题:
      #   ① **抄件走样了吗** —— 合并册的附录 A 逐字节 == 规范仓的附录 A?
      #   ② **实现与快照一致吗** —— 实现的成员集合 == 快照的成员集合?
      # ① 需要规范仓的**整册目录**(注册镜像册),不是语言规范那一个文件 ⇒
      # `WLWL_SPEC_PATH` 不够用,需要目录级的指针。
      #
      # ⚠ 规范仓找不到时守卫**响亮地失败**,**不**回落到仓内任何副本 ——
      # 回落会让「抄件忠实度」这条检查静默失效(读数绿,实际没查)。
      - name: 指向 v1.0 规范仓目录
        shell: bash
        run: echo "WLWL_SPEC_V1_DIR=$GITHUB_WORKSPACE/wlwl-spec-v1" >> "$GITHUB_ENV"

      # [D13-053] 工具链**钉死在仓根 `rust-toolchain.toml`**,本 job 是它的
      # **权威说明处**(另外两处只留一行指回来)。
      #
      # ⚠⚠ **这里刻意不用 `dtolnay/rust-toolchain@stable`。** 那个 action
      #   未传 `toolchain:` 输入时,**默认匹配 `@rev`** —— 也就是 `@stable`
      #   ⇒ 装 stable。其 README 原文:"the default is to match the @rev"。
      #   **它根本不读 `rust-toolchain.toml`。**(这条我一开始写错过:先以为
      #   「去掉 `toolchain:` 输入就会读文件」,查了 action 的 README 才发现
      #   恰恰相反 —— 那样会让本地钉了、CI 照旧漂,**分歧反而变得看不见**。)
      #   ⇒ 改用 **rustup 本尊**:`rustup toolchain install` **不带参数**时
      #   读的正是 override 文件(实测输出:`it's active because: overridden by
      #   '.../rust-toolchain.toml'`),三个平台行为一致。
      #
      # 为什么值得做:2026-10-15 实际发生「本地 stable 停在 1.96、CI 已是 1.99」
      # ⇒ `map_or_identity` / `for_kv_map` 两条 lint 让三平台同时变红,而那两行
      # 代码**早已存在**,与当轮改动无关 —— **发现它的人不是引入它的人**。
      # 浮动式 `stable` 的核心代价就是这个。
      #
      # `matrix.rust` 这个第二出处已一并去掉 ⇒ **单一来源**。版本号仍然会出现在
      # 本步骤日志里(末尾的 `cargo --version`)。`test -f` 那道守卫是为了让
      # 「文件被删掉」**响亮地失败**,而不是静默回落成 runner 自带的 stable。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      # ⚠ [D13-092] **`workspaces: impl -> target`** —— 仓根**没有**
      # `Cargo.toml`(Rust 工作区在 `impl/`),而 action 的默认工作区是**仓根**
      # ⇒ 它在仓根跑 `cargo metadata --all-features --format-version 1 --no-deps`
      # ⇒ **exit 101** ⇒ 日志第一段就是这个
      # (`Error: The process '/Users/runner/.cargo/bin/cargo' failed with exit
      # code 101` + 一整段栈回溯),而且是**每个平台每一轮**都出现。
      #
      # ⚠⚠ 那个 exit 101 背后还有两个**静默**后果(action 自己把它吞了,
      # 只 `console.error` 一句,所以 job 照样绿):
      # ① **依赖集解析为空** ⇒ 缓存键里**没有** `Cargo.toml` / `Cargo.lock`
      #    的哈希 ⇒ 依赖变了缓存**不失效**;
      # ② 缓存的 target 目录指向**不存在的** `<仓根>/target` ⇒ 真实构建目录
      #    `impl/target` **从来没进过缓存**。
      #
      # ⇒ 显式指到 `impl`:metadata 在 `impl` 跑(那儿有 `Cargo.toml`)⇒ 依赖集
      # 正常解析、缓存键带上 manifest / lockfile 的哈希;⚠ target 目录
      # **故意不缓存**(理由见下一条)。
      #
      # ⚠ `cache-targets: false`:**故意不缓存 target 目录** —— 本仓实测
      # `impl/target` 单机就 **26 GB**(debug 档,含 bench / doc 产物),而
      # GitHub 的缓存是**全仓 10 GB 预算** ⇒ 缓存它会挤掉真正有用的
      # `~/.cargo/registry`,净亏。⇒ 这里只缓存 registry(与改动前的**实际**
      # 行为一致:改动前指向的 `<仓根>/target` 从来就不存在)。
      # ⚠ 若将来要缓存 target,先给 `impl` 配一份**瘦身后的** profile
      # (关 `debug` / `incremental`),再把这一项打开。
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "impl -> target"
          cache-targets: false

      # impl/Cargo.lock is gitignored, so the very first CI run on a
      # fresh cache miss has no lock file. --locked refuses to create
      # one, which would fail clippy / doc / test / bench (all of which
      # use --locked). Materialise it here so every subsequent step has
      # a stable lock file. Mirrors release.yml's same step.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo fmt --check
        working-directory: impl
        run: cargo fmt --all -- --check

      # [v0.2 Phase G1] zero-warning clippy gate. This is in addition
      # to `RUSTFLAGS: -D warnings` (which only catches rustc lints)
      # and `cargo fmt --check` (style only). Clippy enforces the
      # idiomatic Rust lints documented in
      # `docs/history/20260902-09.md` 闁? G1.
      - name: cargo clippy -D warnings


        working-directory: impl
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # [v0.2 Phase G3] rustdoc gate. cargo doc with -D warnings
      # ensures all EXISTING docs are valid (no broken intra-doc
      # links, no malformed markdown, no unresolved symbols). The
      # legacy 100% missing_docs requirement from plan 閹?52 is
      # relaxed per P4-G3-001: enabling -D missing_docs would
      # flag 286 existing items + a latent rust 2021 prefix issue
      # in wlwl-std/ai.rs ("real-ai" string literals). Stubs were
      # attempted but the rust 1.96 strict prefix parser rejects
      # the "real-ai" literal altogether; both fixes are deferred
      # to v0.5 as cross-cutting refactors. New items added
      # WITHOUT docs will still emit rustc missing_docs warnings
      # (visible in CI logs) but won't fail the gate.
      - name: cargo doc --no-deps -D warnings
        working-directory: impl
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # [v0.2 Phase G2] cargo-deny license + advisory gate.
      # Hard quality gate per plan 闂?.1 decision #8: G2 must pass
      # before Phase H can tag v0.4.0. Installs cargo-deny ^0.20
      # locally per job (older 0.16 fails to parse CVSS v4.0 in the
      # current RustSec advisory-db). `impl/Cargo.lock` is gitignored,
      # so the first CI run materializes it via `cargo generate-lockfile`;
      # ⚠ **it is NOT restored from `Swatinem/rust-cache`** — that action
      # caches `~/.cargo` (registry / git) and the workspace `target/`;
      # `Cargo.lock` sits in neither ⇒ every run re-resolves it (cheap, and
      # the resolution is stable as long as the crates.io index is).
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
        with:
          version: ^0.20

      - name: cargo-deny check
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi
          cargo deny --locked --all-features check

      # [v0.4 Phase H1] spec section 16.5 conformance suite.
      # Runs `wlwl run --format=jsonl` against 10 canonical
      # `.wll` fixtures and asserts every JSONL error carries
      # all schema-1.1.0 mandatory fields (per P4-H1-002/003).
      # The fixtures live in `impl/tests/conformance/`; the
      # harness lives in `impl/crates/wlwl-cli/tests/conformance.rs`.
      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

      # [v0.11.3 / 审查 N-014-③ + 台账 D13-029]「保留失败名 + 自动复跑一次」。
      #
      # 起因:一次失败无法归因 —— 首轮 `-p wlwl-std --lib` 报 1 failed,但首轮
      # 日志经过 grep 过滤,**失败测试名被过滤掉了**,定位成本远高于跑第二遍。
      # 这里把「信息不丢」放在第一位,「区分真失败 / flaky」放在第二位。
      #
      # ① 为什么统一 `shell: bash`(Windows runner 自带 Git Bash):
      #    复跑 + 判定 + 摘要是**逻辑**,不是一行命令,写成 pwsh 就得再写一份
      #    等价实现,两套语法会各自漂移。GitHub 官方保证 windows-latest 上
      #    `shell: bash` 可用 ⇒ 三个平台跑**同一份脚本**,只有一份真值。
      #    (代价:依赖 Git Bash 存在;这是 runner 契约,不是本仓的赌注。)
      #
      # ② 为什么复跑**整个 `--all-targets`**,而不是只重跑失败的那个测试:
      #    - 失败信息只给出「测试名」,不给出「哪个 target 二进制」;要缩小到
      #      单个二进制得解析 `Running unittests <path>` 行再反推包名,而这个
      #      映射对 doctest / bench target / workspace 虚拟 manifest 都不可靠
      #      —— **解析器本身就成了新的 flaky 来源**。
      #    - flaky 是「任意一项偶发失败」。只重跑那一个测试名,会漏掉同一轮
      #      里另一个 target 的偶发失败,得出「不是 flaky」的错误结论。
      #    - 成本可接受:复跑**只在首轮失败时发生**(正常路径零开销),且此时
      #      编译产物已在 target 目录里,第二遍主要是执行时间。
      #
      # ③ 为什么 flaky **不放行**(仍然 exit 1):
      #    放行会让门禁说谎,而这次事故的根因就是「无法归因」—— 让偶发失败
      #    静默变绿等于把不可归因重新造一遍。区分「真失败 / flaky」的价值由
      #    醒目标注 + step summary + 完整日志承担,放行与否是可改的策略常量:
      #    要改只需把下面的 FLAKY_EXIT_CODE 改成 0(位置已标出)。
      #
      # ④ 覆盖率**一条不少**:命令仍是逐字的 `cargo test --locked --all-targets`,
      #    复跑是**额外**一遍。刻意**没有**加 `--no-fail-fast` —— 它确实能一次
      #    收全所有失败名,但那是在改动既有测试语义(fail-fast 下失败后不再执行
      #    的 target 现在会执行),超出「不改覆盖范围」的授权范围。失败名改由
      #    「完整留存 + 复跑一遍」拿到。
      #
      # ⚠ 运行时提示一律用英文:Windows runner 的 bash locale 非 UTF-8,中文
      #   标注有变乱码的风险,一旦乱码「显式标注」就失去意义。中文解释留在
      #   注释里。日志目录用**相对路径**:绕开 RUNNER_TEMP / GITHUB_WORKSPACE
      #   在 Windows 下是 `D:\...` 形态、而 Git Bash 认正斜杠的路径转换坑。
      - name: cargo test (full log kept; one automatic retry)
        shell: bash
        working-directory: impl
        run: |
          # ⚠ 不用 `-e`:下面的失败码全部由本脚本显式判定。`pipefail` 仍开着
          #   (GitHub 对 `shell: bash` 默认加),所以 PIPESTATUS[0] 才是 cargo 的码。
          set +e
          # ⚠⚠ **[D13-073] 目录名不能以点开头。** `actions/upload-artifact@v4`
          #   默认 `include-hidden-files: false`,而它的 README 原文写明
          #   「**Hidden files are defined as any file beginning with . or files
          #   within folders beginning with .**」⇒ 一个叫 `.ci-logs` 的目录
          #   **整目录被排除** ⇒ 上传那步传了 0 个文件 ⇒ 配合
          #   `if-no-files-found: ignore` 就**静默成功**,而 artifact 根本不存在
          #   (run 241 / 242 实测:上传步 success,artifact 列表 0)。
          #   ⇒ 目录改成 `ci-logs`(不以点开头)才既能被默认 glob 找到、
          #   又不必依赖一个非默认输入项。
          LOG_DIR="ci-logs"
          mkdir -p "$LOG_DIR"

          # FLAKY_EXIT_CODE:首轮失败 + 复跑通过时的最终退出码。
          # 现在是 1(flaky 仍然失败);改成 0 即为「flaky 放行」。
          FLAKY_EXIT_CODE=1

          run_pass() {
            # ⚠ `local` 必须**分三行**写:同一条 `local a="$1" b="$a.log"` 里,
            #   右侧展开发生在整条命令执行之前,此时 `a` 还没赋值 ⇒ `b` 会变成
            #   `cargo-test-.log` —— 两轮**写进同一个文件**,第二轮覆盖第一轮,
            #   「保留第一轮失败名」当场失效。这个坑由本机 stub 沙盘实测抓到。
            local tag="$1"
            local log="$LOG_DIR/cargo-test-$tag.log"
            local rc
            echo "::group::cargo test --locked --all-targets ($tag pass)"
            # ⚠ 完整输出落盘,**不做任何过滤** —— 审查那次就是过滤掉了失败名。
            #   ⚠ 不加 -vv / 不打印环境变量:artifact 会长期留存,不能带 secrets。
            cargo test --locked --all-targets 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            echo "::endgroup::"
            echo "$tag pass exit code: $rc"
            echo "$rc" > "$LOG_DIR/$tag.rc"
          }

          # 摘要用提取,日志用留存:这里的 grep 只服务于 step summary / 标注,
          # 完整日志始终在 artifact 里,失败名不会被这一步弄丢。
          failed_names() {
            grep -E '^test .* \.\.\. FAILED' "$1" 2>/dev/null | tr -d '\r' | sort -u
          }

          # ⚠⚠ **失败用例名必须落进「匿名可读」的位置** —— 这是实测出来的机制缺口。
          #   失败名原先只写进 step summary 与 artifact,而这两处**都要登录**:
          #   匿名 `GET /actions/artifacts/<id>/zip` = 401、`GET /actions/jobs/<id>/logs`
          #   = 403,公开仓也一样(GitHub 现在要求登录才给看 workflow 日志)⇒ 归因时
          #   **拿不到名字**,只能把日志落回仓库求人。
          #   ⇒ 补一条 **workflow annotation**:注解是**匿名可读**的
          #   (`GET /repos/<o>/<r>/check-runs/<id>/annotations` 无需 token)⇒
          #   失败名从此**一次 API 调用就能读到**,不必再走「求人放日志」这条路。
          #   ⚠ 名字放 **message** 不放 title:title 是属性值,`:` 要转义
          #     (测试名里有 `::`),message 不用 ⇒ 放 message 才能**逐字**显示。
          #   ⚠ 注解 message **不能含换行** ⇒ 多行名单折成一行(`; ` 分隔)。
          #   ⚠ 长度封顶:GitHub 单条注解 message 上限 64 KB ⇒ 截断并注明,
          #     **完整**名单仍在 step summary 与 artifact 里(两处都没删)。
          emit_failed_names_annotation() {
            local title="$1"
            local names="$2"
            local flat
            # ⚠ `local` 逐个声明、不合并:右侧引用了前一个变量时,同一行会在
            #   赋值**之前**展开(与 D13-073 那个坑同款)。
            # ⚠ 折行用 `sed` 的 N/a/ba 拼接,不用 `tr '\n' '; '` —— tr 的两个
            #   字符集是**一一对应**映射,`'\n'` 只会映到 `';'`,那个空格是**没用上**的
            #   (本机 Git Bash 实测:输出 `a; b` 而不是 `a; b`)。
            flat="$(printf '%s' "$names" | tr -d '\r' | sed ':a;N;$!ba;s/\n/; /g')"
            if [ -z "$flat" ]; then
              flat="(no '... FAILED' line captured)"
            fi
            if [ "${#flat}" -gt 6000 ]; then
              flat="${flat:0:6000} ... (truncated; full list in the step summary and the log artifact)"
            fi
            echo "::warning title=$title::$flat"
          }

          run_pass first
          if [ "$(cat "$LOG_DIR/first.rc")" = "0" ]; then
            exit 0
          fi

          echo "::warning title=cargo test: pass 1 failed::Pass 1 of 'cargo test --locked --all-targets' failed. Retrying once, in full, to tell a real failure apart from a flaky one. Unfiltered logs are uploaded as an artifact."
          run_pass retry
          retry_rc="$(cat "$LOG_DIR/retry.rc")"
          first_names="$(failed_names "$LOG_DIR/cargo-test-first.log")"
          retry_names="$(failed_names "$LOG_DIR/cargo-test-retry.log")"
          # ⚠ 失败名进**公开注解**(匿名可读)—— 见上面 emit_failed_names_annotation
          #   的说明。两条都发:pass 1 的名单是「当时红了的那些」,pass 2 的是
          #   「复跑时仍然红的那些」⇒ 两者的**差**就是 flaky 的候选集合。
          emit_failed_names_annotation "FAILED tests - pass 1" "$first_names"
          emit_failed_names_annotation "FAILED tests - pass 2" "$retry_names"

          {
            echo "### cargo test result (${{ matrix.os }})"
            echo
            if [ "$retry_rc" = "0" ]; then
              echo "**FLAKY** - pass 1 FAILED, pass 2 PASSED. The job still fails (by design)."
            else
              echo "**REAL FAILURE** - both passes failed. Not flaky."
            fi
            echo
            if [ -z "$first_names" ]; then
              echo "No \`... FAILED\` line in pass 1 -> most likely a compile/link error rather than a test failure. Read the full log."
            fi
            echo "#### FAILED tests - pass 1"
            echo '```'
            echo "${first_names:-(none)}"
            echo '```'
            echo
            echo "#### FAILED tests - pass 2"
            echo '```'
            echo "${retry_names:-(none)}"
            echo '```'
            echo
            echo "Full unfiltered logs: artifact \`cargo-test-logs-${{ matrix.os }}\`."
          } > "$LOG_DIR/summary.md"
          cat "$LOG_DIR/summary.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$LOG_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

          if [ "$retry_rc" = "0" ]; then
            echo "::warning title=FLAKY (cargo test)::${{ matrix.os }}: pass 1 FAILED, pass 2 PASSED -> flaky, NOT auto-cleared. Failing test names are in the step summary and the full-log artifact. Set FLAKY_EXIT_CODE=0 in ci.yml if flaky should be allowed to pass."
            exit "$FLAKY_EXIT_CODE"
          fi
          echo "::error title=REAL FAILURE (cargo test)::${{ matrix.os }}: 'cargo test --locked --all-targets' failed on both passes -> real failure, not flaky."
          exit 1

      # 失败时的第一手证据。⚠ 必须 `if: always()`:上一步失败后 job 的默认
      #   步骤会被跳过,不带条件的上传 step 就永远不会执行 —— 那正是「日志丢了」
      #   最容易复发的形态。
      # ⚠ `if-no-files-found: error`:⚠⚠ **原来这里是 `ignore`,那正是「日志明明
      #   没存下来、这一步却显示 success」的成因** —— `ignore` 语义 = 「找不到
      #   文件就算了」,于是「日志机制自己坏了」被**静默吞掉**。⇒ 改成 `error`:
      #   日志目录不存在 ⇒ **这一步直接红** ⇒ 机制坏了必须有人看见。
      #   (这个目录由测试步骤**无条件** `mkdir -p` 创建,所以正常路径上它必然存在。)
      # ⚠ `include-hidden-files: true`:目录名已不以点开头,这一项是**冗余兜底**
      #   —— 万一以后有人把目录名改回带点的,这里仍能兜住。
      # ⚠ artifact 名带 `matrix.os`:upload-artifact@v4 在同一 run 内不允许重名,
      #   三个平台同名会直接撞车。
      # ⚠ 用 `always()` 而非 `failure()`:成功轮次也会留一份完整日志(成本是
      #   每平台几十 KB、压缩后更小),换来的是「什么时候跑的、跑了多少条」永远
      #   可查 —— 归属不清的那次事故里,缺的正是这一份对照。
      - name: Upload cargo test logs (unfiltered, incl. failed test names)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-logs-${{ matrix.os }}
          path: impl/ci-logs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      # ⚠⚠ **[D13-073] 上传那步显示 success ≠ 真的有 artifact。**
      #
      # run 241 / 242 的实测:上传那步**显示 success**,而 artifact 列表是 **0**
      # —— 因为目录名以点开头被默认排除 + `if-no-files-found: ignore` 把它静默
      # 吞了。⇒ **「步骤成功」不能当「日志存下来了」的证据**。
      # 这一步拿 API **回读一次**:artifact 不在列表里就当失败。
      # ⚠ 为什么要重试:artifact 的可见性可能比上传动作**稍晚**(索引有延迟),
      #   所以查不到就隔几秒再查,最多十次;真的一直查不到才判失败。
      - name: Verify the log artifact really exists
        if: always()
        # ⚠⚠ **必须 `shell: bash`。** GitHub 对 `run:` 的默认 shell 是
        #   「Linux/macOS ⇒ bash,Windows ⇒ pwsh」—— 而 windows-latest 在这个
        #   matrix 里。pwsh 下这段脚本**整段作废**:`set -uo pipefail` 不是 pwsh
        #   语法(`set` 在 pwsh 里是 `Set-Variable` 的别名),`for _ in 1 2 3` 不是
        #   pwsh 的循环语法,`printf`/`grep -qx` 也得换成别的写法。
        #   ⇒ **不写 `shell: bash`,Windows 平台这一步必然失败**,而且失败原因
        #   长得像「守卫判定 artifact 缺失」—— **假阴性**。
        #   (Windows runner 自带 Git Bash,这是 runner 契约。)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          expected="cargo-test-logs-${{ matrix.os }}"
          names=""
          # ⚠⚠ **重试次数按实测定的,不是拍脑袋** —— run 39282312320 三平台实测:
          #   ubuntu **0.39 s**(一次就查到)、macOS **1.20 s**(一次)、
          #   **Windows 9.90 s(试了 3 次才查到)** ⇒ 索引延迟是实打实的,
          #   而且**同一个 run 里三个平台不一样**。
          # ⚠ 窗口从 10×5 秒放宽到 **30×5 秒(150 秒)**:代价只是「万一真缺
          #   artifact 时多等 2.5 分钟才红」,收益是消掉「artifact 其实在、只是
          #   索引没跟上」这种**假红** —— 假红会消耗人的注意力,代价更高。
          # ⚠ 另:实测 GitHub 的 **jobs 接口**在 run 报 completed 之后仍能
          #   连续 60 秒返回旧状态 ⇒ 「回读类断言必须带重试」不是杞人忧天。
          # ⚠ 用 bash 的 `{1..30}` 展开,不用 `seq` —— 后者是**外部命令**,
          #   而 `seq` 一旦不在 PATH,`for` 的词表就是空的 ⇒ **循环体一次都不跑**
          #   ⇒ 脚本直接落到「missing log artifact」⇒ **Windows 平台假红**。
          #   `{1..30}` 是 bash 内建展开,没有这个风险。
          for _ in {1..30}; do
            # ⚠⚠ **API 失败与「artifact 不存在」必须分开** —— 两者都是「查不到」,
            #   但只有后者是「日志没存下来」。把 API 失败当成后者 ⇒ **CI 会无故变红**
            #   (那是本步自己造的假阴性,比没这个守卫还糟)。
            #
            # stderr 单独收进临时文件:成功时绝不能混进 artifact 名单
            # (gh 的告警会污染 `$names`),失败时又要把它**原样带进报错**,
            # 否则只看到「查询失败」四个字,还得再猜是权限还是网络。
            err_file="$(mktemp)"
            if names=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '.artifacts[].name' 2>"$err_file"); then
              rm -f "$err_file"
              # ⚠ 去掉可能的尾随 CR:Windows 上某些工具的输出带 CRLF,而
              #   `grep -qx` 要求**整行完全相等** —— 一个尾随 CR 就会把
              #   「artifact 明明在」判成「不在」,又是一个假阴性。
              #   (与本 workflow 里 failed_names() 的 `tr -d '\r'` 同款理由。)
              names="$(printf '%s\n' "$names" | tr -d '\r')"
              if printf '%s\n' "$names" | grep -qx "$expected"; then
                echo "artifact present: $expected"
                exit 0
              fi
              # API 正常但还没看到 ⇒ 可能是**索引延迟**,隔几秒再查。
            else
              echo "::error title=artifact check failed::gh api 查询失败 —— 无法确认 artifact '$expected' 是否存在(GITHUB_TOKEN 需要 actions: read 权限)。API 原始错误:$(tr '\n' ' ' < "$err_file")"
              rm -f "$err_file"
              exit 1
            fi
            sleep 5
          done
          echo "::error title=missing log artifact::expected artifact '$expected' was not found; the log-preservation mechanism is broken (an upload step reporting success does NOT mean an artifact exists)"
          printf 'artifacts actually present:\n%s\n' "$names"
          exit 1

      # [G-25] §5.4 差异登记的「状态」列 ↔ 契约表 —— **双向核对门禁**。
      #
      # 为什么要有它:一致性册 §5.4 的「状态」列是**手工维护**的 ⇒ 实现的代码
      # 收敛了、契约表也写了,但**登记没跟着翻** ⇒ 登记长期落后于基线。
      # 2026-10-25 实测(本仓 v0.11.4 基线):§5.4 的 **14 条「未实现」里 13 条
      # 早已实现**(契约表全绿)⇒ 照着登记做规划的人会去**重做 13 件已经做完的事**,
      # 而**没有任何机制会发现这件事**。
      # ⇒ 这道门禁把每一行差异挂到**可运行的契约测试**上:
      #   **行里写着「未实现」而契约表全绿 ⇒ 门禁红**;反向也查(登记「已实现」
      # 而契约红 ⇒ 实现回退,门禁也红)。
      #
      # ⚠ 规范仓已在本 job 检出(**钉死提交**)且 `WLWL_SPEC_V1_DIR` 已指向它 ⇒
      #   门禁读的是**钉死的那一份**一致性册,不是本仓的任何副本。
      # ⚠ 找不到规范仓时门禁**响亮地失败**(不回落、不静默跳过)—— 回落会让
      #   读数绿、实际没查。
      # ⚠ 接线表 `script/conformance_registry_map.json` 是**人工维护**的:
      #   §5.4 每新增一行差异,那里必须同时加一条,否则门禁红(这正是
      #   「登记与实现脱节」的第一步)。
      # ⚠ [v0.12.0] 门禁是 **python** 脚本 ⇒ 解释器必须**显式**装一个：
      #   本 job 的矩阵含 `windows-latest` ⇒ runner 镜像里 `python` 这个名字
      #   **不保证**存在（也没有 `python3` 这个别名）⇒ 装一个再调用。
      - name: Set up Python (§5.4 门禁)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: §5.4 状态列 ↔ 契约表 一致性门禁
        shell: bash
        working-directory: impl
        run: python ../script/check_conformance_registry.py

      # [D11-019] `real-ai` 特性编译门禁。
      #
      # 这条路径从 v0.4 起就没人编译过:M2 把 `StdCtx` 搬进 `wlwl-value`
      # 时静默丢掉了 `#[cfg(feature = "real-ai")] http_client` 字段,而默认
      # 构建不带该 feature ⇒ 1824 项测试全绿也照不出来。同一处还藏着一
      # 个 E0502 借用冲突(即便把字段补回去也编不过)。默认门禁永远碰不到
      # 这条路径,所以这里显式编一次:它不需要网络,只需要 `cargo check`。
      # 注:上面那道 `cargo deny --all-features` 已经把这个 feature 的依赖
      # 拉进解析图,这里只做类型检查,不建 reqwest 的 TLS 栈。
      - name: cargo check --features wlwl-std/real-ai
        working-directory: impl
        run: cargo check --locked -p wlwl-std --features real-ai

      # [v0.2 Phase G8] perf regression smoke. The full benchmark suite
      # is exercised against `benches/baseline.txt` (Phase F1) on a
      # longer schedule (weekly supply-chain.yml runs in parallel);
      # here we ensure the 5 benchmarks compile and the smoke run
      # completes within the CI time budget. Performance regression
      # against baseline.txt is reviewed via
      # `cargo bench -- --save-baseline fix-N` then diff.
      - name: cargo bench (smoke)
        shell: bash
        working-directory: impl
        run: |
          cargo bench --no-run --locked
          cargo bench -p wlwl-eval --bench eval_hot_paths \
            -- --warm-up-time 1 --measurement-time 2 --sample-size 10

  smoke:
    # ⚠⚠ **这个 `name:` 同样是 main 分支保护规则里的 required status check**
    # (`smoke run examples`)—— 改了它,保护规则静默失配 ⇒ PR 永远卡在
    # 「Expected — Waiting for status to be reported」。改名前先同步更新保护规则。
    name: smoke run examples
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # impl/Cargo.lock is gitignored; this smoke job gets a fresh
      # checkout from actions/checkout@v4 (default `clean: true`)
      # which discards whatever the test job materialised. Add the
      # same Materialize guard as the test job so --locked works.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo build --release
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: Run hello.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/hello.wll

      - name: Run phase2_demo.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/phase2_demo.wll

      # [v0.10.1] step 名此前写 "parse + name-check only",但 `check` 并不做
      # name-check:实测 `PRINT(NOPE)` 在 `check` 下是 `OK: parsed`(`E0020` 是
      # 运行期诊断)。名字改成它实际做的事,免得下一个人以为这里挡住了
      # 未定义名。完整边界见 `wlwl check --help`。
      - name: wlwl check (parse + lint; no name resolution)
        working-directory: impl
        run: ./target/release/wlwl check examples/phase2_demo.wll