name: CI

# 触发条件随工作分支同步更新。此前这里只有 `main`,而 wip 分支的推送**不触发
# 任何 workflow** —— 也就是说 wip 期间的 fmt / clippy / cargo-deny / test /
# conformance 门禁全部处于「没人跑」的状态,只有开 PR 才走一遍。v0.11 期间曾
# 临时把 `wip0.11` 加进下面两个列表,该分支已并入 main 并删除,规则随之撤除。
#
# 若将来还有 wip 分支,同样加进这两个列表(push 侧按**被推**的分支过滤,
# pull_request 侧按**基**分支过滤),收工时记得撤掉。
#
# [v0.11.3] 2026-10-05:`wip0.11.3` 按上述规则加入(M0–M4 收口后要跑一遍
# 全套门禁,而 push 到 wip 分支本身不触发任何 workflow)。**该分支并入 main
# 后这两行要撤掉** —— 与 v0.11 时期 `wip0.11` 的处理同款。
on:
  push:
    branches: [main, wip0.11.3]
  pull_request:
    branches: [main, wip0.11.3]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }} / rust pinned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链**钉死在仓根 `rust-toolchain.toml`**,本 job 是它的
      # **权威说明处**(另外两处只留一行指回来)。
      #
      # ⚠⚠ **这里刻意不用 `dtolnay/rust-toolchain@stable`。** 那个 action
      #   未传 `toolchain:` 输入时,**默认匹配 `@rev`** —— 也就是 `@stable`
      #   ⇒ 装 stable。其 README 原文:"the default is to match the @rev"。
      #   **它根本不读 `rust-toolchain.toml`。**(这条我一开始写错过:先以为
      #   「去掉 `toolchain:` 输入就会读文件」,查了 action 的 README 才发现
      #   恰恰相反 —— 那样会让本地钉了、CI 照旧漂,**分歧反而变得看不见**。)
      #   ⇒ 改用 **rustup 本尊**:`rustup toolchain install` **不带参数**时
      #   读的正是 override 文件(实测输出:`it's active because: overridden by
      #   '.../rust-toolchain.toml'`),三个平台行为一致。
      #
      # 为什么值得做:2026-10-15 实际发生「本地 stable 停在 1.96、CI 已是 1.99」
      # ⇒ `map_or_identity` / `for_kv_map` 两条 lint 让三平台同时变红,而那两行
      # 代码**早已存在**,与当轮改动无关 —— **发现它的人不是引入它的人**。
      # 浮动式 `stable` 的核心代价就是这个。
      #
      # `matrix.rust` 这个第二出处已一并去掉 ⇒ **单一来源**。版本号仍然会出现在
      # 本步骤日志里(末尾的 `cargo --version`)。`test -f` 那道守卫是为了让
      # 「文件被删掉」**响亮地失败**,而不是静默回落成 runner 自带的 stable。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # impl/Cargo.lock is gitignored, so the very first CI run on a
      # fresh cache miss has no lock file. --locked refuses to create
      # one, which would fail clippy / doc / test / bench (all of which
      # use --locked). Materialise it here so every subsequent step has
      # a stable lock file. Mirrors release.yml's same step.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo fmt --check
        working-directory: impl
        run: cargo fmt --all -- --check

      # [v0.2 Phase G1] zero-warning clippy gate. This is in addition
      # to `RUSTFLAGS: -D warnings` (which only catches rustc lints)
      # and `cargo fmt --check` (style only). Clippy enforces the
      # idiomatic Rust lints documented in
      # `docs/history/20260902-09.md` 闁? G1.
      - name: cargo clippy -D warnings


        working-directory: impl
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # [v0.2 Phase G3] rustdoc gate. cargo doc with -D warnings
      # ensures all EXISTING docs are valid (no broken intra-doc
      # links, no malformed markdown, no unresolved symbols). The
      # legacy 100% missing_docs requirement from plan 閹?52 is
      # relaxed per P4-G3-001: enabling -D missing_docs would
      # flag 286 existing items + a latent rust 2021 prefix issue
      # in wlwl-std/ai.rs ("real-ai" string literals). Stubs were
      # attempted but the rust 1.96 strict prefix parser rejects
      # the "real-ai" literal altogether; both fixes are deferred
      # to v0.5 as cross-cutting refactors. New items added
      # WITHOUT docs will still emit rustc missing_docs warnings
      # (visible in CI logs) but won't fail the gate.
      - name: cargo doc --no-deps -D warnings
        working-directory: impl
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # [v0.2 Phase G2] cargo-deny license + advisory gate.
      # Hard quality gate per plan 闂?.1 decision #8: G2 must pass
      # before Phase H can tag v0.4.0. Installs cargo-deny ^0.20
      # locally per job (older 0.16 fails to parse CVSS v4.0 in the
      # current RustSec advisory-db). `impl/Cargo.lock` is gitignored,
      # so the first CI run materializes it via `cargo generate-lockfile`;
      # subsequent runs get it back from `Swatinem/rust-cache`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
        with:
          version: ^0.20

      - name: cargo-deny check
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi
          cargo deny --locked --all-features check

      # [v0.4 Phase H1] spec section 16.5 conformance suite.
      # Runs `wlwl run --format=jsonl` against 10 canonical
      # `.wll` fixtures and asserts every JSONL error carries
      # all schema-1.1.0 mandatory fields (per P4-H1-002/003).
      # The fixtures live in `impl/tests/conformance/`; the
      # harness lives in `impl/crates/wlwl-cli/tests/conformance.rs`.
      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

      # [v0.11.3 / 审查 N-014-③ + 台账 D13-029]「保留失败名 + 自动复跑一次」。
      #
      # 起因:一次失败无法归因 —— 首轮 `-p wlwl-std --lib` 报 1 failed,但首轮
      # 日志经过 grep 过滤,**失败测试名被过滤掉了**,定位成本远高于跑第二遍。
      # 这里把「信息不丢」放在第一位,「区分真失败 / flaky」放在第二位。
      #
      # ① 为什么统一 `shell: bash`(Windows runner 自带 Git Bash):
      #    复跑 + 判定 + 摘要是**逻辑**,不是一行命令,写成 pwsh 就得再写一份
      #    等价实现,两套语法会各自漂移。GitHub 官方保证 windows-latest 上
      #    `shell: bash` 可用 ⇒ 三个平台跑**同一份脚本**,只有一份真值。
      #    (代价:依赖 Git Bash 存在;这是 runner 契约,不是本仓的赌注。)
      #
      # ② 为什么复跑**整个 `--all-targets`**,而不是只重跑失败的那个测试:
      #    - 失败信息只给出「测试名」,不给出「哪个 target 二进制」;要缩小到
      #      单个二进制得解析 `Running unittests <path>` 行再反推包名,而这个
      #      映射对 doctest / bench target / workspace 虚拟 manifest 都不可靠
      #      —— **解析器本身就成了新的 flaky 来源**。
      #    - flaky 是「任意一项偶发失败」。只重跑那一个测试名,会漏掉同一轮
      #      里另一个 target 的偶发失败,得出「不是 flaky」的错误结论。
      #    - 成本可接受:复跑**只在首轮失败时发生**(正常路径零开销),且此时
      #      编译产物已在 target 目录里,第二遍主要是执行时间。
      #
      # ③ 为什么 flaky **不放行**(仍然 exit 1):
      #    放行会让门禁说谎,而这次事故的根因就是「无法归因」—— 让偶发失败
      #    静默变绿等于把不可归因重新造一遍。区分「真失败 / flaky」的价值由
      #    醒目标注 + step summary + 完整日志承担,放行与否是可改的策略常量:
      #    要改只需把下面的 FLAKY_EXIT_CODE 改成 0(位置已标出)。
      #
      # ④ 覆盖率**一条不少**:命令仍是逐字的 `cargo test --locked --all-targets`,
      #    复跑是**额外**一遍。刻意**没有**加 `--no-fail-fast` —— 它确实能一次
      #    收全所有失败名,但那是在改动既有测试语义(fail-fast 下失败后不再执行
      #    的 target 现在会执行),超出「不改覆盖范围」的授权范围。失败名改由
      #    「完整留存 + 复跑一遍」拿到。
      #
      # ⚠ 运行时提示一律用英文:Windows runner 的 bash locale 非 UTF-8,中文
      #   标注有变乱码的风险,一旦乱码「显式标注」就失去意义。中文解释留在
      #   注释里。日志目录用**相对路径**:绕开 RUNNER_TEMP / GITHUB_WORKSPACE
      #   在 Windows 下是 `D:\...` 形态、而 Git Bash 认正斜杠的路径转换坑。
      - name: cargo test (full log kept; one automatic retry)
        shell: bash
        working-directory: impl
        run: |
          # ⚠ 不用 `-e`:下面的失败码全部由本脚本显式判定。`pipefail` 仍开着
          #   (GitHub 对 `shell: bash` 默认加),所以 PIPESTATUS[0] 才是 cargo 的码。
          set +e
          LOG_DIR=".ci-logs"
          mkdir -p "$LOG_DIR"

          # FLAKY_EXIT_CODE:首轮失败 + 复跑通过时的最终退出码。
          # 现在是 1(flaky 仍然失败);改成 0 即为「flaky 放行」。
          FLAKY_EXIT_CODE=1

          run_pass() {
            # ⚠ `local` 必须**分三行**写:同一条 `local a="$1" b="$a.log"` 里,
            #   右侧展开发生在整条命令执行之前,此时 `a` 还没赋值 ⇒ `b` 会变成
            #   `cargo-test-.log` —— 两轮**写进同一个文件**,第二轮覆盖第一轮,
            #   「保留第一轮失败名」当场失效。这个坑由本机 stub 沙盘实测抓到。
            local tag="$1"
            local log="$LOG_DIR/cargo-test-$tag.log"
            local rc
            echo "::group::cargo test --locked --all-targets ($tag pass)"
            # ⚠ 完整输出落盘,**不做任何过滤** —— 审查那次就是过滤掉了失败名。
            #   ⚠ 不加 -vv / 不打印环境变量:artifact 会长期留存,不能带 secrets。
            cargo test --locked --all-targets 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            echo "::endgroup::"
            echo "$tag pass exit code: $rc"
            echo "$rc" > "$LOG_DIR/$tag.rc"
          }

          # 摘要用提取,日志用留存:这里的 grep 只服务于 step summary / 标注,
          # 完整日志始终在 artifact 里,失败名不会被这一步弄丢。
          failed_names() {
            grep -E '^test .* \.\.\. FAILED' "$1" 2>/dev/null | tr -d '\r' | sort -u
          }

          run_pass first
          if [ "$(cat "$LOG_DIR/first.rc")" = "0" ]; then
            exit 0
          fi

          echo "::warning title=cargo test: pass 1 failed::Pass 1 of 'cargo test --locked --all-targets' failed. Retrying once, in full, to tell a real failure apart from a flaky one. Unfiltered logs are uploaded as an artifact."
          run_pass retry
          retry_rc="$(cat "$LOG_DIR/retry.rc")"
          first_names="$(failed_names "$LOG_DIR/cargo-test-first.log")"
          retry_names="$(failed_names "$LOG_DIR/cargo-test-retry.log")"

          {
            echo "### cargo test result (${{ matrix.os }})"
            echo
            if [ "$retry_rc" = "0" ]; then
              echo "**FLAKY** - pass 1 FAILED, pass 2 PASSED. The job still fails (by design)."
            else
              echo "**REAL FAILURE** - both passes failed. Not flaky."
            fi
            echo
            if [ -z "$first_names" ]; then
              echo "No \`... FAILED\` line in pass 1 -> most likely a compile/link error rather than a test failure. Read the full log."
            fi
            echo "#### FAILED tests - pass 1"
            echo '```'
            echo "${first_names:-(none)}"
            echo '```'
            echo
            echo "#### FAILED tests - pass 2"
            echo '```'
            echo "${retry_names:-(none)}"
            echo '```'
            echo
            echo "Full unfiltered logs: artifact \`cargo-test-logs-${{ matrix.os }}\`."
          } > "$LOG_DIR/summary.md"
          cat "$LOG_DIR/summary.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$LOG_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

          if [ "$retry_rc" = "0" ]; then
            echo "::warning title=FLAKY (cargo test)::${{ matrix.os }}: pass 1 FAILED, pass 2 PASSED -> flaky, NOT auto-cleared. Failing test names are in the step summary and the full-log artifact. Set FLAKY_EXIT_CODE=0 in ci.yml if flaky should be allowed to pass."
            exit "$FLAKY_EXIT_CODE"
          fi
          echo "::error title=REAL FAILURE (cargo test)::${{ matrix.os }}: 'cargo test --locked --all-targets' failed on both passes -> real failure, not flaky."
          exit 1

      # 失败时的第一手证据。⚠ 必须 `if: always()`:上一步失败后 job 的默认
      #   步骤会被跳过,不带条件的上传 step 就永远不会执行 —— 那正是「日志丢了」
      #   最容易复发的形态。
      # ⚠ `if-no-files-found: ignore`:前面的 fmt / clippy / doc 门禁先失败时
      #   这一步也要能安静跑完,不能反过来把结论搅浑(它们失败时本步无日志可传)。
      # ⚠ artifact 名带 `matrix.os`:upload-artifact@v4 在同一 run 内不允许重名,
      #   三个平台同名会直接撞车。
      # ⚠ 用 `always()` 而非 `failure()`:成功轮次也会留一份完整日志(成本是
      #   每平台几十 KB、压缩后更小),换来的是「什么时候跑的、跑了多少条」永远
      #   可查 —— 归属不清的那次事故里,缺的正是这一份对照。
      - name: Upload cargo test logs (unfiltered, incl. failed test names)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-logs-${{ matrix.os }}
          path: impl/.ci-logs/
          if-no-files-found: ignore
          retention-days: 14

      # [D11-019] `real-ai` 特性编译门禁。
      #
      # 这条路径从 v0.4 起就没人编译过:M2 把 `StdCtx` 搬进 `wlwl-value`
      # 时静默丢掉了 `#[cfg(feature = "real-ai")] http_client` 字段,而默认
      # 构建不带该 feature ⇒ 1824 项测试全绿也照不出来。同一处还藏着一
      # 个 E0502 借用冲突(即便把字段补回去也编不过)。默认门禁永远碰不到
      # 这条路径,所以这里显式编一次:它不需要网络,只需要 `cargo check`。
      # 注:上面那道 `cargo deny --all-features` 已经把这个 feature 的依赖
      # 拉进解析图,这里只做类型检查,不建 reqwest 的 TLS 栈。
      - name: cargo check --features wlwl-std/real-ai
        working-directory: impl
        run: cargo check --locked -p wlwl-std --features real-ai

      # [v0.2 Phase G8] perf regression smoke. The full benchmark suite
      # is exercised against `benches/baseline.txt` (Phase F1) on a
      # longer schedule (weekly supply-chain.yml runs in parallel);
      # here we ensure the 5 benchmarks compile and the smoke run
      # completes within the CI time budget. Performance regression
      # against baseline.txt is reviewed via
      # `cargo bench -- --save-baseline fix-N` then diff.
      - name: cargo bench (smoke)
        shell: bash
        working-directory: impl
        run: |
          cargo bench --no-run --locked
          cargo bench -p wlwl-eval --bench eval_hot_paths \
            -- --warm-up-time 1 --measurement-time 2 --sample-size 10

  smoke:
    name: smoke run examples
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # impl/Cargo.lock is gitignored; this smoke job gets a fresh
      # checkout from actions/checkout@v4 (default `clean: true`)
      # which discards whatever the test job materialised. Add the
      # same Materialize guard as the test job so --locked works.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo build --release
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: Run hello.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/hello.wll

      - name: Run phase2_demo.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/phase2_demo.wll

      # [v0.10.1] step 名此前写 "parse + name-check only",但 `check` 并不做
      # name-check:实测 `PRINT(NOPE)` 在 `check` 下是 `OK: parsed`(`E0020` 是
      # 运行期诊断)。名字改成它实际做的事,免得下一个人以为这里挡住了
      # 未定义名。完整边界见 `wlwl check --help`。
      - name: wlwl check (parse + lint; no name resolution)
        working-directory: impl
        run: ./target/release/wlwl check examples/phase2_demo.wll