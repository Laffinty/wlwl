name: CI

# 触发条件随工作分支同步更新。此前这里只有 `main`,而 wip 分支的推送**不触发
# 任何 workflow** —— 也就是说 wip 期间的 fmt / clippy / cargo-deny / test /
# conformance 门禁全部处于「没人跑」的状态,只有开 PR 才走一遍。v0.11 期间曾
# 临时把 `wip0.11` 加进下面两个列表,该分支已并入 main 并删除,规则随之撤除。
#
# 若将来还有 wip 分支,同样加进这两个列表(push 侧按**被推**的分支过滤,
# pull_request 侧按**基**分支过滤),收工时记得撤掉。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }} / rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # impl/Cargo.lock is gitignored, so the very first CI run on a
      # fresh cache miss has no lock file. --locked refuses to create
      # one, which would fail clippy / doc / test / bench (all of which
      # use --locked). Materialise it here so every subsequent step has
      # a stable lock file. Mirrors release.yml's same step.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo fmt --check
        working-directory: impl
        run: cargo fmt --all -- --check

      # [v0.2 Phase G1] zero-warning clippy gate. This is in addition
      # to `RUSTFLAGS: -D warnings` (which only catches rustc lints)
      # and `cargo fmt --check` (style only). Clippy enforces the
      # idiomatic Rust lints documented in
      # `docs/history/20260902-09.md` 闁? G1.
      - name: cargo clippy -D warnings


        working-directory: impl
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # [v0.2 Phase G3] rustdoc gate. cargo doc with -D warnings
      # ensures all EXISTING docs are valid (no broken intra-doc
      # links, no malformed markdown, no unresolved symbols). The
      # legacy 100% missing_docs requirement from plan 閹?52 is
      # relaxed per P4-G3-001: enabling -D missing_docs would
      # flag 286 existing items + a latent rust 2021 prefix issue
      # in wlwl-std/ai.rs ("real-ai" string literals). Stubs were
      # attempted but the rust 1.96 strict prefix parser rejects
      # the "real-ai" literal altogether; both fixes are deferred
      # to v0.5 as cross-cutting refactors. New items added
      # WITHOUT docs will still emit rustc missing_docs warnings
      # (visible in CI logs) but won't fail the gate.
      - name: cargo doc --no-deps -D warnings
        working-directory: impl
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # [v0.2 Phase G2] cargo-deny license + advisory gate.
      # Hard quality gate per plan 闂?.1 decision #8: G2 must pass
      # before Phase H can tag v0.4.0. Installs cargo-deny ^0.20
      # locally per job (older 0.16 fails to parse CVSS v4.0 in the
      # current RustSec advisory-db). `impl/Cargo.lock` is gitignored,
      # so the first CI run materializes it via `cargo generate-lockfile`;
      # subsequent runs get it back from `Swatinem/rust-cache`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
        with:
          version: ^0.20

      - name: cargo-deny check
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi
          cargo deny --locked --all-features check

      # [v0.4 Phase H1] spec section 16.5 conformance suite.
      # Runs `wlwl run --format=jsonl` against 10 canonical
      # `.wll` fixtures and asserts every JSONL error carries
      # all schema-1.1.0 mandatory fields (per P4-H1-002/003).
      # The fixtures live in `impl/tests/conformance/`; the
      # harness lives in `impl/crates/wlwl-cli/tests/conformance.rs`.
      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

      - name: cargo test
        working-directory: impl
        run: cargo test --locked --all-targets

      # [D11-019] `real-ai` 特性编译门禁。
      #
      # 这条路径从 v0.4 起就没人编译过:M2 把 `StdCtx` 搬进 `wlwl-value`
      # 时静默丢掉了 `#[cfg(feature = "real-ai")] http_client` 字段,而默认
      # 构建不带该 feature ⇒ 1824 项测试全绿也照不出来。同一处还藏着一
      # 个 E0502 借用冲突(即便把字段补回去也编不过)。默认门禁永远碰不到
      # 这条路径,所以这里显式编一次:它不需要网络,只需要 `cargo check`。
      # 注:上面那道 `cargo deny --all-features` 已经把这个 feature 的依赖
      # 拉进解析图,这里只做类型检查,不建 reqwest 的 TLS 栈。
      - name: cargo check --features wlwl-std/real-ai
        working-directory: impl
        run: cargo check --locked -p wlwl-std --features real-ai

      # [v0.2 Phase G8] perf regression smoke. The full benchmark suite
      # is exercised against `benches/baseline.txt` (Phase F1) on a
      # longer schedule (weekly supply-chain.yml runs in parallel);
      # here we ensure the 5 benchmarks compile and the smoke run
      # completes within the CI time budget. Performance regression
      # against baseline.txt is reviewed via
      # `cargo bench -- --save-baseline fix-N` then diff.
      - name: cargo bench (smoke)
        shell: bash
        working-directory: impl
        run: |
          cargo bench --no-run --locked
          cargo bench -p wlwl-eval --bench eval_hot_paths \
            -- --warm-up-time 1 --measurement-time 2 --sample-size 10

  smoke:
    name: smoke run examples
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # impl/Cargo.lock is gitignored; this smoke job gets a fresh
      # checkout from actions/checkout@v4 (default `clean: true`)
      # which discards whatever the test job materialised. Add the
      # same Materialize guard as the test job so --locked works.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::group::generate Cargo.lock (first run)"
            cargo generate-lockfile
            echo "::endgroup::"
          fi

      - name: cargo build --release
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: Run hello.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/hello.wll

      - name: Run phase2_demo.wll
        working-directory: impl
        run: ./target/release/wlwl run examples/phase2_demo.wll

      # [v0.10.1] step 名此前写 "parse + name-check only",但 `check` 并不做
      # name-check:实测 `PRINT(NOPE)` 在 `check` 下是 `OK: parsed`(`E0020` 是
      # 运行期诊断)。名字改成它实际做的事,免得下一个人以为这里挡住了
      # 未定义名。完整边界见 `wlwl check --help`。
      - name: wlwl check (parse + lint; no name resolution)
        working-directory: impl
        run: ./target/release/wlwl check examples/phase2_demo.wll