name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0). Defaults to the latest pushed tag.'
        required: false

permissions:
  contents: write

jobs:
  # [v0.10.4] 版本号守卫。**必须排在 build 之前**:build 会编出二进制、
  # sign 会签、release 会发布 —— 一旦错版发布出去,就是撤不回来的既成事实。
  #
  # 为什么需要它:`wlwl -V` 报的是 `CARGO_PKG_VERSION`(即
  # `impl/Cargo.toml` 的 `[workspace.package] version`),而不是 git tag。
  # 两者靠人记得同步,而这已经**连续漏了三次**:v0.10.1 / v0.10.2 / v0.10.3
  # 的产物全都报 `wlwl 0.10.0`。文档里写几遍口径都没用 —— 写口径的那句本身
  # 就写着「本版不动」,于是它变成了一种**被正式追认的错版**。
  #
  # 规则:**tag 就是权威**。发 `vN.M.P` 之前先把 Cargo 版本改成 `N.M.P`,
  # 本 job 会验证两者一致;不一致直接失败,错版无法发布。
  version-check:
    name: version guard (tag == Cargo version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 本身,`ref` 默认就是被推的那个 tag。
          ref: ${{ github.ref }}

      - name: Compare tag against impl/Cargo.toml [workspace.package] version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO="$(grep -E '^version[[:space:]]*=' impl/Cargo.toml \
                   | head -1 \
                   | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "cargo : $CARGO"
          if [ -z "$CARGO" ]; then
            echo "::error::could not read version from impl/Cargo.toml"
            exit 1
          fi

          # tag 来自三个可能的来源,按可靠性排序。
          # 注意 `workflow_dispatch` 分支下 GITHUB_REF_NAME 是**分支名**而不是
          # tag —— 所以那条路径必须用 input,否则本守卫会把一次合法的手动
          # 触发也判成错版。(顺带说明:该路径下 build/sign 用的仍是
          # GITHUB_REF_NAME,手动触发本来就会把产物名标错,那是既有问题。)
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            echo "::notice::workflow_dispatch without a 'tag' input — skipping the version guard (an explicit operator override)."
            exit 0
          fi
          echo "tag   : $TAG"

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::'$TAG' is not a vX.Y.Z tag — skipping the version guard."
              exit 0
              ;;
          esac

          # ⚠ [v0.11.3_rc1] **预发布 tag 比的是「基版本」。**
          #
          # `v0.11.3_rc1` 发布的二进制报的是 `wlwl 0.11.3` —— RC 与正式版是
          # **同一份代码**,基版本相同即合法;基版本不同仍然是错版 ⇒ 仍然红。
          # ⚠ 为什么以前没这条:守卫是 v0.10.4 才加的,而那之前**没有任何 RC
          #   tag 存在过**(远端 tag 全是正式版)⇒ 守卫一直没遇到过 RC,而
          #   `v0.11.3_rc1` 会命中 `v[0-9]*.[0-9]*.[0-9]*` ⇒ 守卫照跑 ⇒ 逐字
          #   比较必然不等 ⇒ **任何 RC tag 都过不了这道守卫**(实测)。
          # ⚠ 为什么不能改成「Cargo 版本 = tag 去 v」:下划线**不是合法 semver**
          #   (实测 `cargo metadata` 报 `unexpected character '_' after patch
          #   version number`)⇒ 把 `[workspace.package] version` 写成
          #   `0.11.3_rc1` 会让**全仓每一条 cargo 命令都崩**。
          # ⚠ 后缀集合与下面 release job 的 `prerelease` 表达式**保持一致**
          #   (否则会出现「是预发布却没标」或「标了预发布却按正式版比」)。
          BASE_TAG="$TAG"
          case "$TAG" in
            *[-_]rc*) BASE_TAG="${TAG%%[-_]rc*}" ;;
            *-alpha*) BASE_TAG="${TAG%%-alpha*}" ;;
            *-beta*)  BASE_TAG="${TAG%%-beta*}" ;;
            *-dev*)   BASE_TAG="${TAG%%-dev*}" ;;
          esac
          echo "base  : $BASE_TAG"

          if [ "v$CARGO" != "$BASE_TAG" ]; then
            echo "::error::tag $TAG (base $BASE_TAG) does not match impl/Cargo.toml version $CARGO — the binary would report 'wlwl $CARGO' while being published as $TAG. Set [workspace.package] version = \"${BASE_TAG#v}\" in impl/Cargo.toml, commit, and re-tag."
            exit 1
          fi
          echo "ok: $TAG (base $BASE_TAG) matches Cargo version $CARGO"

  build:
    name: build (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: wlwl.exe
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install aarch64 cross toolchain (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -y && sudo apt-get install -y gcc-aarch64-linux-gnu

      # impl/Cargo.lock is gitignored, so the very first build of a
      # fresh tag has no lock file. `--locked` refuses to create one,
      # so materialize it here. Subsequent runs (incl. cross-target
      # reuse on the same SHA) hit Swatinem's cache.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release
        working-directory: impl
        env:
          # Force the cross gcc so rust stops invoking host rust-lld,
          # which refuses --fix-cortex-a53-843419 when cross-linking
          # to aarch64-unknown-linux-gnu.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --bin wlwl --target ${{ matrix.target }}

      # [v0.12.1 / 计划 §0 第 4 件] **TLS 扩展产物随发行包发布**。
      #
      # ⚠ 此前 staging **只**放编译器二进制 + R1 stdlib 副本 + 例子 + 源码 tarball
      #   ⇒ **发布包里没有 TLS 动态库**（实测 run #44 建的 release：5 个资产里
      #   没有任何一个是 TLS 动态库）⇒ 计划 §0 第 4 件未完成。
      # ⚠ `wlwl-tls-ext` 是**独立 workspace**（`impl/ext/wlwl-tls-ext/` 自带
      #   Cargo.lock）⇒ 主 workspace 的任何构建都**碰不到**它 ⇒ 这里显式构建。
      #   （它自己的 Cargo.lock **入库** ⇒ `--locked` 可用，依赖集随源码冻结。）
      # ⚠ **必须用同一个 `--target`** ⇒ 否则包里会混进别的架构的动态库。
      # ⚠ aarch64 的交叉 linker 由上面那步的 `env` 给出 —— ⚠ 那步的 env **只**
      #   作用于那一个 step ⇒ 这里**再声明一次**（否则交叉链接会找不到 cc）。
      - name: Build the TLS extension (wlwl-tls cdylib)
        working-directory: impl/ext/wlwl-tls-ext
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip binary (linux/macos)
        if: matrix.archive == 'tar.xz'
        run: |
          # aarch64-linux-gnu is a cross build from x86_64; host `strip`
          # doesn't recognise aarch64 ELF. The cross toolchain we
          # installed above also pulls in binutils-aarch64-linux-gnu,
          # which gives us the right strip.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          fi

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          cp "$GITHUB_WORKSPACE/LICENSE" staging/
          cp "$GITHUB_WORKSPACE/README.md" staging/
          cp "$GITHUB_WORKSPACE/CHANGELOG.md" staging/
          mkdir -p staging/examples
          cp -r "$GITHUB_WORKSPACE/impl/examples/." staging/examples/
          # [2026-10-22] **发布包不再含 `docs/` 文件夹** —— 规范已独立成仓
          # (`Laffinty/wlwl-spec-v1`),仓内**不再保留**原先的 `docs/spec/` 与
          # `docs/stdlib/` 两个文件夹;合并后的次级规范 `docs/wlwl-spec-reference.md`
          # 是**仓内专供 AI agent / 机器守卫**读的次级件,**不随包分发**。
          #
          # ⚠ 下面 `staging/stdlib/` **保留**:那是 R1 语言层**源码**的参考
          # 副本(`--std-src` 开发覆盖用),与文档无关 —— 文档是 `docs/`,
          # 源码是 `stdlib/`。删掉它会连带破坏 M1-4 的「产物含 R1 源码副本」。
          mkdir -p staging/stdlib
          cp -r "$GITHUB_WORKSPACE/impl/crates/wlwl-std/wl/std/." staging/stdlib/
          cp -r "$GITHUB_WORKSPACE/wlwl-skill" staging/wlwl-skill/

      # [G-06] **把源码树打进发布包** —— 此前发布包只有二进制 + R1 stdlib 副本
      # + 例子 + 文档 ⇒ **没有编译器源码** ⇒ 离线状态下「读源码 / 改这个语言 /
      # 核对某个行为到底怎么实现的」都不可行 ⇒ 用户只能自己去 GitHub 拉 tag
      # 源码（实测 `github.com` 直连超时，得走 `codeload`）。
      #
      # ⇒ 这里随包发一份 `wlwl-src.tar.gz`（**排除构建产物**）＋ 一份
      #   `SOURCE_HASH`（可复算的树哈希）⇒ 「只有发布包的机器」也能离线取到源码。
      # ⚠ 哈希**可复算**：解开 tarball 后 `python script/package_source.py
      #   --verify <src-dir> --hash-file SOURCE_HASH` 就能核对。
      #
      # ⚠ [v0.12.0] **python 必须显式装**：本 job 的矩阵含 `windows-latest`
      #   ⇒ runner 镜像里**不保证**有 `python3` 这个别名（Windows 上只有 `python`）
      #   ⇒ 这里用 `actions/setup-python` 固定一个解释器，再统一用 `python` 调用。
      - name: Set up Python (G-06)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # [v0.12.1 / 计划 §0 第 4 件] 把 **TLS 扩展动态库**装进 staging。
      #
      # ⚠ 放在 `Set up Python` **之后** ⇒ 哈希用 `python` 算：五个矩阵项都有
      #   python，而 `sha256sum` 在 Windows 的 Git Bash 里不保证存在。
      # ⚠ 动态库文件名各平台不同 ⇒ 按 target 分派；名字**保持 cargo 给的**
      #   （`wlwl_tls.dll` / `libwlwl_tls.dylib` / `libwlwl_tls.so`）⇒ 宿主
      #   `wlwl run --ext <path>` 拿到的就是能直接 `dlopen` 的那个文件。
      # ⚠ **ABI 版本随包走**（宿主加载时**必须**校验它）⇒ 从**单一真相**
      #   `impl/crates/wlwl-ext/src/abi.rs` 里读出来，不在 workflow 里写死
      #   （写死 ⇒ 宿主升 ABI 时这里会悄悄过期）。
      # ⚠ **产物缺失就响亮失败** —— 不静默发一个「没有 TLS 动态库」的包
      #   （那正是 run #44 的状态）。
      - name: Stage the TLS extension (ABI version + hash)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-windows-*) lib="wlwl_tls.dll" ;;
            *-apple-*)  lib="libwlwl_tls.dylib" ;;
            *)          lib="libwlwl_tls.so" ;;
          esac
          src="impl/ext/wlwl-tls-ext/target/${{ matrix.target }}/release/$lib"
          if [ ! -f "$src" ]; then
            echo "::error::TLS extension artifact missing: $src"
            exit 1
          fi
          # ABI 版本（单一真相 = 宿主侧的 abi.rs；扩展用 #[path] 引用同一份）
          abi=$(sed -n 's/^pub const ABI_VERSION: u32 = \([0-9][0-9]*\);/\1/p' \
                impl/crates/wlwl-ext/src/abi.rs)
          if [ -z "$abi" ]; then
            echo "::error::cannot read ABI_VERSION from impl/crates/wlwl-ext/src/abi.rs"
            exit 1
          fi
          mkdir -p staging/wlwl-tls
          cp "$src" "staging/wlwl-tls/$lib"
          printf '%s\n' "$abi" > staging/wlwl-tls/ABI_VERSION
          python -c "import hashlib,sys,os;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+os.path.basename(p))" \
            "$PWD/staging/wlwl-tls/$lib" > staging/wlwl-tls/SHA256SUMS
          echo "staged TLS extension: $lib (abi_version=$abi)"
          ls -l staging/wlwl-tls

      - name: Package the source tree (G-06)
        shell: bash
        run: |
          set -euo pipefail
          python script/package_source.py \
            --root "$GITHUB_WORKSPACE" \
            --out staging/wlwl-src.tar.gz \
            --hash-out staging/SOURCE_HASH

      - name: Create tar.xz (linux/macos)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="wlwl-${tag}-${TARGET}"
          mv staging "$out"
          tar -cJf "${out}.tar.xz" "$out"
          echo "ASSET=${out}.tar.xz" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Create zip (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $out = "wlwl-$tag-$env:TARGET"
          Move-Item -Path staging -Destination $out
          Compress-Archive -Path "$out\*" -DestinationPath "${out}.zip" -Force
          "ASSET=${out}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  sbom:
    # [v0.2 Phase G10] SBOM generation. CycloneDX JSON attached
    # alongside the binary archive. Anchored to the build job so we
    # only emit one SBOM per target (not one per matrix leg).
    #
    # [T-09 / v0.12.1] **SBOM 覆盖 TLS 扩展的依赖闭包。**
    # `impl/ext/wlwl-tls-ext/` 是**独立 workspace**(自带空的 `[workspace]` 表
    # ⇒ 自己解版本、自己出 `Cargo.lock`)⇒ 主 workspace 的 `cargo cyclonedx`
    # **扫不到它**⇒ 此前发布的 SBOM 里没有 TLS 扩展自持的那套依赖
    # (`rustls` / `ring` / `webpki-roots` …)⇒ 供应链清单漏了随发行包一起
    # 发出去的那半边(审计 `docs/plan/wlwl-v0.12.1-functional-audit.md` §5.3)。
    #
    # ⇒ 本 job 现在做四件事：
    #   ① 主 workspace 出一份 SBOM(原有行为不变);
    #   ② **对扩展单独出一份**(`--target all` ⇒ 连平台专属的依赖也覆盖);
    #   ③ 把 ② 的组件**合并进 ①**(同一个文件),并把「覆盖了扩展 lock 里的哪些包」
    #      写进 `metadata.properties`(带扩展 lock 的 sha256)⇒ 可回溯、可守卫;
    #   ④ **回读校验**:真的把落盘的 SBOM 读回来逐条核对(见下面的 verify 步)。
    #
    # ⚠ **TLS 扩展本体不是 SBOM 组件** —— 它是我们自己的产物;SBOM 要覆盖的是
    #   它的**第三方依赖**(第三方 crates)。
    name: generate SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx
        with:
          version: ^0.5

      # [T-09] 合并 / 校验 SBOM 要读 JSON ⇒ 显式装一个解释器。
      # 与 build job 的 `Set up Python (G-06)` 同一套 action —— **不是新工具链**,
      # 只是把「用哪个 python」钉死,不依赖 runner 镜像里的默认 python。
      - name: Set up Python (SBOM merge & verify)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo cyclonedx (build release first to populate SBOM deps)
        shell: bash
        working-directory: impl
        run: |
          set -euo pipefail
          cargo build --locked --release --bin wlwl
          # cargo-cyclonedx 0.5.x removed --output-file; the default
          # output path is `target/<override-filename>.json`. So with
          # override-filename sbom, we get target/sbom.json.
          cargo cyclonedx \
            --format json \
            --override-filename sbom \
            --spec-version 1.5
          # ⚠ [T-09] 落盘位置**不写死**:0.5.9 的实际输出路径在本仓**从未被验证过**
          #   (下面的 upload 路径一直是错的 ⇒ 产物从来没进过 artifact ⇒ 没人看到
          #   过这个文件到底落在哪)⇒ 这里**找出来**再归位到 `target/sbom.json`。
          #   `-print -quit` 而不是 `| head -1`:后者在 `set -o pipefail` 下会因
          #   SIGPIPE 让整条管道返回 141 ⇒ 把这一步搞红。
          sbom_json=""
          for cand in target/sbom.json sbom.json; do
            if [ -f "$cand" ]; then sbom_json="$cand"; break; fi
          done
          if [ -z "$sbom_json" ]; then
            sbom_json="$(find . -maxdepth 3 -name 'sbom*.json' -type f -print -quit)"
          fi
          if [ -z "$sbom_json" ]; then
            echo "::error::cargo cyclonedx produced no SBOM for the main workspace"
            exit 1
          fi
          mkdir -p target
          if [ "$sbom_json" != "target/sbom.json" ]; then
            cp "$sbom_json" target/sbom.json
          fi
          echo "main SBOM: $sbom_json -> target/sbom.json"
          # ⚠ 上传的路径是**相对仓库根**的 ⇒ 之前写 `target/sbom.json`(少一层
          #   `impl/`)⇒ upload-artifact 找不到文件,而它默认 `if-no-files-found:
          #   warn` ⇒ **上传「成功」但产物根本没进 artifact**(见下面的 error 选项)。
          echo "ASSET_SBOM=impl/target/sbom.json" >> "$GITHUB_ENV"

      # [T-09] **TLS 扩展单独出一份 SBOM**(它是独立 workspace,主 workspace 那次
      # `cargo cyclonedx` 扫不到它)。
      - name: cargo cyclonedx (TLS extension workspace)
        shell: bash
        working-directory: impl/ext/wlwl-tls-ext
        run: |
          set -euo pipefail
          # ⚠ 扩展的 `Cargo.lock` **是入库的** ⇒ 依赖集随源码冻结。
          #   这里**绝不**跑 `cargo generate-lockfile`(那会造出一份不入库的 lock,
          #   依赖集就跟发布物对不上了)⇒ lock 缺失就响亮失败。
          test -f Cargo.lock || { echo "::error::impl/ext/wlwl-tls-ext/Cargo.lock is missing (it must be committed)"; exit 1; }
          # ⚠ cargo-cyclonedx **没有** `--locked` 选项 ⇒ 用 cargo 自己的
          #   `--locked` 先把「lock 与 Cargo.toml 一致」这条约束钉死:
          #   lock 过期 ⇒ 这一步直接红(而不是悄悄重解一份新 lock)。
          cargo metadata --locked --format-version 1 > /dev/null
          cargo cyclonedx \
            --format json \
            --override-filename sbom-tls-ext \
            --target all \
            --spec-version 1.5
          # 同上:落盘位置找出来,不写死。
          tls_json=""
          for cand in target/sbom-tls-ext.json sbom-tls-ext.json; do
            if [ -f "$cand" ]; then tls_json="$cand"; break; fi
          done
          if [ -z "$tls_json" ]; then
            tls_json="$(find . -maxdepth 3 -name 'sbom-tls-ext*.json' -type f -print -quit)"
          fi
          if [ -z "$tls_json" ]; then
            echo "::error::cargo cyclonedx produced no SBOM for the TLS extension"
            exit 1
          fi
          # ⚠ 记**绝对路径**:下一步的 CWD 是仓库根,相对路径会指到别处。
          echo "TLS_SBOM=$GITHUB_WORKSPACE/$tls_json" >> "$GITHUB_ENV"

      # [T-09] 把扩展的 SBOM **合并进**主 SBOM(同一个文件)。
      - name: Merge the TLS extension SBOM into the main SBOM
        shell: bash
        env:
          TLS_SBOM: ${{ env.TLS_SBOM }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, sys

          MAIN = "impl/target/sbom.json"
          LOCK = "impl/ext/wlwl-tls-ext/Cargo.lock"
          EXT_NAME = "wlwl-tls-ext"

          def die(msg):
              sys.stderr.write("::error::%s\n" % msg)
              sys.exit(1)

          tls_path = os.environ.get("TLS_SBOM", "")
          if not tls_path or not os.path.isfile(tls_path):
              die("TLS extension SBOM not found (TLS_SBOM=%r)" % tls_path)
          if not os.path.isfile(MAIN):
              die("main SBOM not found: %s" % MAIN)
          if not os.path.isfile(LOCK):
              die("TLS extension Cargo.lock not found: %s" % LOCK)

          with open(MAIN, encoding="utf-8") as f:
              base = json.load(f)
          with open(tls_path, encoding="utf-8") as f:
              tls = json.load(f)

          def ref_of(c):
              return c.get("bom-ref") or c.get("purl") or "%s@%s" % (c.get("name"), c.get("version"))

          def nv(c):
              return "%s@%s" % (c.get("name"), c.get("version"))

          base_root = ref_of(base["metadata"]["component"])
          tls_root = ref_of(tls["metadata"]["component"])

          # ① 组件:主 SBOM 的 + 扩展的(按 bom-ref 去重)。
          #    ⚠ TLS 扩展**本体**(及其 target 子组件)是我们的产物 ⇒ 不进组件表。
          comps = list(base.get("components", []))
          known = set(ref_of(c) for c in comps)
          added = []
          for c in tls.get("components", []):
              r = ref_of(c)
              if r == tls_root or r.startswith(tls_root + "?"):
                  continue
              if r in known:
                  continue
              known.add(r)
              comps.append(c)
              added.append(nv(c))

          # ② 依赖图:扩展的边挂到主 SBOM 的根节点上(发布物是一套)。
          deps = {}
          order = []
          def add(r, ds):
              if r not in deps:
                  deps[r] = set()
                  order.append(r)
              deps[r].update(ds or [])
          for d in base.get("dependencies", []):
              add(d.get("ref"), d.get("dependsOn"))
          for d in tls.get("dependencies", []):
              r = d.get("ref")
              add(base_root if r == tls_root else r, d.get("dependsOn"))
          valid = set(known) | {base_root}
          base["components"] = comps
          base["dependencies"] = [
              {"ref": r, "dependsOn": sorted(x for x in deps[r] if x in valid)}
              for r in order if r in valid
          ]

          # ③ 覆盖标记(回溯 + 反向守卫用):扩展 lock 的 sha256 + 覆盖到的包清单。
          lock_sha = hashlib.sha256(open(LOCK, "rb").read()).hexdigest()
          lock_pkgs = set()
          for blk in open(LOCK, encoding="utf-8").read().split("[[package]]")[1:]:
              n = re.search(r'^name = "(.*)"', blk, re.M)
              v = re.search(r'^version = "(.*)"', blk, re.M)
              if n and v:
                  lock_pkgs.add("%s@%s" % (n.group(1), v.group(1)))
          lock_pkgs = set(p for p in lock_pkgs if not p.startswith(EXT_NAME + "@"))
          have = set(nv(c) for c in comps)
          covered = sorted(p for p in lock_pkgs if p in have)
          missing = sorted(p for p in lock_pkgs if p not in have)

          props = base.setdefault("metadata", {}).setdefault("properties", [])
          def setprop(name, value):
              for p in props:
                  if p.get("name") == name:
                      p["value"] = value
                      return
              props.append({"name": name, "value": value})

          setprop("wlwl:sbom:covered-workspaces", "impl, impl/ext/wlwl-tls-ext")
          setprop("wlwl:sbom:tls-ext-lock", "impl/ext/wlwl-tls-ext/Cargo.lock")
          setprop("wlwl:sbom:tls-ext-lock-sha256", lock_sha)
          setprop("wlwl:sbom:tls-ext-packages-covered", str(len(covered)))
          setprop("wlwl:sbom:tls-ext-packages", ",".join(covered))

          with open(MAIN, "w", encoding="utf-8") as f:
              json.dump(base, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("components: %d (added from the TLS extension: %d)" % (len(comps), len(added)))
          print("TLS extension lock: %d packages, covered: %d" % (len(lock_pkgs), len(covered)))
          if added:
              print("added: %s" % ", ".join(added))
          if missing:
              print("::warning::TLS extension lock packages not in the merged SBOM: %s" % ", ".join(missing))
          PY

      # [T-09] **回读校验** —— 不是「命令退出码 0 就算数」:把落盘的 SBOM 真的读回来
      # 逐条核对。这就是审计 T-09 的反向守卫:**把扩展那两步从 job 里摘掉
      # ⇒ 下面的标记检查必红**(主 SBOM 里本来就有 rustls/ring —— 走 reqwest
      # ⇒ 光查「名字在不在」不够,必须查「这份 SBOM 声明覆盖了扩展的 lock」)。
      - name: Verify the SBOM on disk (TLS extension closure covered)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, sys

          MAIN = "impl/target/sbom.json"
          LOCK = "impl/ext/wlwl-tls-ext/Cargo.lock"
          EXT_NAME = "wlwl-tls-ext"
          REQUIRED = ("rustls", "ring", "webpki-roots")

          def die(msg):
              sys.stderr.write("::error::%s\n" % msg)
              sys.exit(1)

          if not os.path.isfile(MAIN):
              die("SBOM not found on disk: %s" % MAIN)
          if os.path.getsize(MAIN) == 0:
              die("SBOM is empty: %s" % MAIN)
          with open(MAIN, encoding="utf-8") as f:
              bom = json.load(f)

          if bom.get("bomFormat") != "CycloneDX":
              die("not a CycloneDX document: %r" % bom.get("bomFormat"))
          if str(bom.get("specVersion")) != "1.5":
              die("unexpected specVersion: %r" % bom.get("specVersion"))

          props = {}
          for p in bom.get("metadata", {}).get("properties", []):
              props[p.get("name")] = p.get("value")

          # ① 覆盖声明:扩展那步被摘掉 ⇒ 没有这段标记 ⇒ 红。
          if props.get("wlwl:sbom:covered-workspaces") != "impl, impl/ext/wlwl-tls-ext":
              die("the SBOM does not declare TLS extension coverage "
                  "(metadata.properties 'wlwl:sbom:covered-workspaces' missing)")

          lock_sha = hashlib.sha256(open(LOCK, "rb").read()).hexdigest()
          if props.get("wlwl:sbom:tls-ext-lock-sha256") != lock_sha:
              die("the SBOM was not generated from the committed TLS extension Cargo.lock "
                  "(lock sha256 %s, SBOM claims %r)" % (lock_sha, props.get("wlwl:sbom:tls-ext-lock-sha256")))

          # ② 扩展 lock 里的包集合(= 扩展依赖闭包的真相来源)。
          lock_pkgs = {}
          for blk in open(LOCK, encoding="utf-8").read().split("[[package]]")[1:]:
              n = re.search(r'^name = "(.*)"', blk, re.M)
              v = re.search(r'^version = "(.*)"', blk, re.M)
              if n and v:
                  lock_pkgs[n.group(1)] = v.group(1)
          lock_pkgs.pop(EXT_NAME, None)

          # ③ SBOM 里的组件。
          comps = {}
          for c in bom.get("components", []):
              comps.setdefault(c.get("name"), set()).add(c.get("version"))

          for name in REQUIRED:
              want = lock_pkgs.get(name)
              if want is None:
                  die("required crate %r is not in the TLS extension Cargo.lock" % name)
              if want not in comps.get(name, set()):
                  die("required crate %s@%s is MISSING from the SBOM" % (name, want))
              print("ok: %s@%s is present in the SBOM" % (name, want))

          if EXT_NAME in comps:
              die("the TLS extension itself (%s) must not be an SBOM component" % EXT_NAME)

          # ④ 标记里声称覆盖的扩展依赖,必须真的在组件表里。
          claimed = [x for x in (props.get("wlwl:sbom:tls-ext-packages") or "").split(",") if x]
          for item in claimed:
              n, _, v = item.rpartition("@")
              if v not in comps.get(n, set()):
                  die("the SBOM claims to cover %s, but that component is missing" % item)

          missing = sorted("%s@%s" % (n, v) for n, v in lock_pkgs.items()
                           if v not in comps.get(n, set()))
          print("TLS extension lock: %d packages; represented in the SBOM: %d"
                % (len(lock_pkgs), len(lock_pkgs) - len(missing)))
          if missing:
              print("::warning::TLS extension packages not represented in the SBOM: %s"
                  % ", ".join(missing))
          print("SBOM verified on disk: %d components" % len(bom.get("components", [])))
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ env.ASSET_SBOM }}
          # ⚠ [T-09] 历史上出过「上传显示 success 但文件其实没落盘」——
          #   upload-artifact v4 默认 `if-no-files-found: warn` ⇒ 路径写错只是
          #   一句 warning,产物静默消失(下游 sign job 拿到的是空的 SBOM)。
          #   这里显式 `error`:路径写错 = 这一步红,发布不会带着空的 SBOM 出去。
          if-no-files-found: error

  sign:
    name: cosign keyless sign binaries + SBOM
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for sigstore keyless OIDC
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign sign (each binary)
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign sign-blob \
              --output signature \
              --bundle "$asset.bundle" \
              "$asset"
            echo "Signed $asset"
          done

      - name: cosign attach SBOM (predicate)
        shell: bash
        run: |
          set -euo pipefail
          sbom="dist/sbom/sbom.json"
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign attach sbom \
              --sbom "$sbom" \
              --signature "$asset.signature" \
              "$asset" || echo "WARN: cosign attach sbom not yet available for $asset"
          done

  conformance:
    # [v0.4 Phase H1] spec section 16.5 conformance gate. Blocks
    # the release job unless every fixture in
    # `impl/tests/conformance/*.wll` runs and emits a well-formed
    # JSONL error envelope (per P4-H1-002/003). Triggered by tag
    # push; workflow_dispatch reuses the same gate.
    name: spec conformance suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release --bin wlwl
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

  release:
    name: github release
    needs: [build, sbom, sign, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # [v0.10.0_rc1] 预发布标记按 tag 名算,不让 RC 冒充正式版。
          # 之前这里没传 `prerelease`,action 默认建**正式** release ——
          # 于是 `v0.10.0_rc1` 会被工具链当成 production ready 抓走。
          # 用表达式而不是 action 的 `auto` 值:`prerelease` 文档里只承诺
          # Boolean,`auto` 的推导规则未在 v2 上核实过。
          # 带 `-rc` / `_rc` / `-alpha` / `-beta` / `-dev` 后缀的 tag 判为
          # pre-release;`v0.10.0` 这种裸版本号仍是正式版。写成单行是
          # 刻意的:发布 workflow 挂掉 = 这次没有 release,不值得为排版冒险。
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '_rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-dev') }}
          files: |
            dist/**/*.tar.xz
            dist/**/*.zip
