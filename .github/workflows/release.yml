name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0). Defaults to the latest pushed tag.'
        required: false

permissions:
  contents: write

jobs:
  # [v0.10.4] 版本号守卫。**必须排在 build 之前**:build 会编出二进制、
  # sign 会签、release 会发布 —— 一旦错版发布出去,就是撤不回来的既成事实。
  #
  # 为什么需要它:`wlwl -V` 报的是 `CARGO_PKG_VERSION`(即
  # `impl/Cargo.toml` 的 `[workspace.package] version`),而不是 git tag。
  # 两者靠人记得同步,而这已经**连续漏了三次**:v0.10.1 / v0.10.2 / v0.10.3
  # 的产物全都报 `wlwl 0.10.0`。文档里写几遍口径都没用 —— 写口径的那句本身
  # 就写着「本版不动」,于是它变成了一种**被正式追认的错版**。
  #
  # 规则:**tag 就是权威**。发 `vN.M.P` 之前先把 Cargo 版本改成 `N.M.P`,
  # 本 job 会验证两者一致;不一致直接失败,错版无法发布。
  version-check:
    name: version guard (tag == Cargo version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 本身,`ref` 默认就是被推的那个 tag。
          ref: ${{ github.ref }}

      - name: Compare tag against impl/Cargo.toml [workspace.package] version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO="$(grep -E '^version[[:space:]]*=' impl/Cargo.toml \
                   | head -1 \
                   | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "cargo : $CARGO"
          if [ -z "$CARGO" ]; then
            echo "::error::could not read version from impl/Cargo.toml"
            exit 1
          fi

          # tag 来自三个可能的来源,按可靠性排序。
          # 注意 `workflow_dispatch` 分支下 GITHUB_REF_NAME 是**分支名**而不是
          # tag —— 所以那条路径必须用 input,否则本守卫会把一次合法的手动
          # 触发也判成错版。(顺带说明:该路径下 build/sign 用的仍是
          # GITHUB_REF_NAME,手动触发本来就会把产物名标错,那是既有问题。)
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            echo "::notice::workflow_dispatch without a 'tag' input — skipping the version guard (an explicit operator override)."
            exit 0
          fi
          echo "tag   : $TAG"

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::'$TAG' is not a vX.Y.Z tag — skipping the version guard."
              exit 0
              ;;
          esac

          # ⚠ [v0.11.3_rc1] **预发布 tag 比的是「基版本」。**
          #
          # `v0.11.3_rc1` 发布的二进制报的是 `wlwl 0.11.3` —— RC 与正式版是
          # **同一份代码**,基版本相同即合法;基版本不同仍然是错版 ⇒ 仍然红。
          # ⚠ 为什么以前没这条:守卫是 v0.10.4 才加的,而那之前**没有任何 RC
          #   tag 存在过**(远端 tag 全是正式版)⇒ 守卫一直没遇到过 RC,而
          #   `v0.11.3_rc1` 会命中 `v[0-9]*.[0-9]*.[0-9]*` ⇒ 守卫照跑 ⇒ 逐字
          #   比较必然不等 ⇒ **任何 RC tag 都过不了这道守卫**(实测)。
          # ⚠ 为什么不能改成「Cargo 版本 = tag 去 v」:下划线**不是合法 semver**
          #   (实测 `cargo metadata` 报 `unexpected character '_' after patch
          #   version number`)⇒ 把 `[workspace.package] version` 写成
          #   `0.11.3_rc1` 会让**全仓每一条 cargo 命令都崩**。
          # ⚠ 后缀集合与下面 release job 的 `prerelease` 表达式**保持一致**
          #   (否则会出现「是预发布却没标」或「标了预发布却按正式版比」)。
          BASE_TAG="$TAG"
          case "$TAG" in
            *[-_]rc*) BASE_TAG="${TAG%%[-_]rc*}" ;;
            *-alpha*) BASE_TAG="${TAG%%-alpha*}" ;;
            *-beta*)  BASE_TAG="${TAG%%-beta*}" ;;
            *-dev*)   BASE_TAG="${TAG%%-dev*}" ;;
          esac
          echo "base  : $BASE_TAG"

          if [ "v$CARGO" != "$BASE_TAG" ]; then
            echo "::error::tag $TAG (base $BASE_TAG) does not match impl/Cargo.toml version $CARGO — the binary would report 'wlwl $CARGO' while being published as $TAG. Set [workspace.package] version = \"${BASE_TAG#v}\" in impl/Cargo.toml, commit, and re-tag."
            exit 1
          fi
          echo "ok: $TAG (base $BASE_TAG) matches Cargo version $CARGO"

  build:
    name: build (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: wlwl.exe
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install aarch64 cross toolchain (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -y && sudo apt-get install -y gcc-aarch64-linux-gnu

      # impl/Cargo.lock is gitignored, so the very first build of a
      # fresh tag has no lock file. `--locked` refuses to create one,
      # so materialize it here. Subsequent runs (incl. cross-target
      # reuse on the same SHA) hit Swatinem's cache.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release
        working-directory: impl
        env:
          # Force the cross gcc so rust stops invoking host rust-lld,
          # which refuses --fix-cortex-a53-843419 when cross-linking
          # to aarch64-unknown-linux-gnu.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --bin wlwl --target ${{ matrix.target }}

      - name: Strip binary (linux/macos)
        if: matrix.archive == 'tar.xz'
        run: |
          # aarch64-linux-gnu is a cross build from x86_64; host `strip`
          # doesn't recognise aarch64 ELF. The cross toolchain we
          # installed above also pulls in binutils-aarch64-linux-gnu,
          # which gives us the right strip.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          fi

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          cp "$GITHUB_WORKSPACE/LICENSE" staging/
          cp "$GITHUB_WORKSPACE/README.md" staging/
          cp "$GITHUB_WORKSPACE/CHANGELOG.md" staging/
          mkdir -p staging/examples
          cp -r "$GITHUB_WORKSPACE/impl/examples/." staging/examples/
          # [2026-10-22] **发布包不再含 `docs/` 文件夹** —— 规范已独立成仓
          # (`Laffinty/wlwl-spec-v1`),仓内**不再保留**原先的 `docs/spec/` 与
          # `docs/stdlib/` 两个文件夹;合并后的次级规范 `docs/wlwl-spec-reference.md`
          # 是**仓内专供 AI agent / 机器守卫**读的次级件,**不随包分发**。
          #
          # ⚠ 下面 `staging/stdlib/` **保留**:那是 R1 语言层**源码**的参考
          # 副本(`--std-src` 开发覆盖用),与文档无关 —— 文档是 `docs/`,
          # 源码是 `stdlib/`。删掉它会连带破坏 M1-4 的「产物含 R1 源码副本」。
          mkdir -p staging/stdlib
          cp -r "$GITHUB_WORKSPACE/impl/crates/wlwl-std/wl/std/." staging/stdlib/
          cp -r "$GITHUB_WORKSPACE/wlwl-skill" staging/wlwl-skill/

      # [G-06] **把源码树打进发布包** —— 此前发布包只有二进制 + R1 stdlib 副本
      # + 例子 + 文档 ⇒ **没有编译器源码** ⇒ 离线状态下「读源码 / 改这个语言 /
      # 核对某个行为到底怎么实现的」都不可行 ⇒ 用户只能自己去 GitHub 拉 tag
      # 源码（实测 `github.com` 直连超时，得走 `codeload`）。
      #
      # ⇒ 这里随包发一份 `wlwl-src.tar.gz`（**排除构建产物**）＋ 一份
      #   `SOURCE_HASH`（可复算的树哈希）⇒ 「只有发布包的机器」也能离线取到源码。
      # ⚠ 哈希**可复算**：解开 tarball 后 `python script/package_source.py
      #   --verify <src-dir> --hash-file SOURCE_HASH` 就能核对。
      #
      # ⚠ [v0.12.0] **python 必须显式装**：本 job 的矩阵含 `windows-latest`
      #   ⇒ runner 镜像里**不保证**有 `python3` 这个别名（Windows 上只有 `python`）
      #   ⇒ 这里用 `actions/setup-python` 固定一个解释器，再统一用 `python` 调用。
      - name: Set up Python (G-06)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Package the source tree (G-06)
        shell: bash
        run: |
          set -euo pipefail
          python script/package_source.py \
            --root "$GITHUB_WORKSPACE" \
            --out staging/wlwl-src.tar.gz \
            --hash-out staging/SOURCE_HASH

      - name: Create tar.xz (linux/macos)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="wlwl-${tag}-${TARGET}"
          mv staging "$out"
          tar -cJf "${out}.tar.xz" "$out"
          echo "ASSET=${out}.tar.xz" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Create zip (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $out = "wlwl-$tag-$env:TARGET"
          Move-Item -Path staging -Destination $out
          Compress-Archive -Path "$out\*" -DestinationPath "${out}.zip" -Force
          "ASSET=${out}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  sbom:
    # [v0.2 Phase G10] SBOM generation. CycloneDX JSON attached
    # alongside the binary archive. Anchored to the build job so we
    # only emit one SBOM per target (not one per matrix leg).
    name: generate SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx
        with:
          version: ^0.5

      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo cyclonedx (build release first to populate SBOM deps)
        working-directory: impl
        run: |
          cargo build --locked --release --bin wlwl
          # cargo-cyclonedx 0.5.x removed --output-file; the default
          # output path is `target/<override-filename>.json`. So with
          # override-filename sbom, we get target/sbom.json.
          cargo cyclonedx \
            --format json \
            --override-filename sbom \
            --spec-version 1.5
          echo "ASSET_SBOM=target/sbom.json" >> "$GITHUB_ENV"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ env.ASSET_SBOM }}

  sign:
    name: cosign keyless sign binaries + SBOM
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for sigstore keyless OIDC
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign sign (each binary)
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign sign-blob \
              --output signature \
              --bundle "$asset.bundle" \
              "$asset"
            echo "Signed $asset"
          done

      - name: cosign attach SBOM (predicate)
        shell: bash
        run: |
          set -euo pipefail
          sbom="dist/sbom/sbom.json"
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign attach sbom \
              --sbom "$sbom" \
              --signature "$asset.signature" \
              "$asset" || echo "WARN: cosign attach sbom not yet available for $asset"
          done

  conformance:
    # [v0.4 Phase H1] spec section 16.5 conformance gate. Blocks
    # the release job unless every fixture in
    # `impl/tests/conformance/*.wll` runs and emits a well-formed
    # JSONL error envelope (per P4-H1-002/003). Triggered by tag
    # push; workflow_dispatch reuses the same gate.
    name: spec conformance suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release --bin wlwl
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

  release:
    name: github release
    needs: [build, sbom, sign, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # [v0.10.0_rc1] 预发布标记按 tag 名算,不让 RC 冒充正式版。
          # 之前这里没传 `prerelease`,action 默认建**正式** release ——
          # 于是 `v0.10.0_rc1` 会被工具链当成 production ready 抓走。
          # 用表达式而不是 action 的 `auto` 值:`prerelease` 文档里只承诺
          # Boolean,`auto` 的推导规则未在 v2 上核实过。
          # 带 `-rc` / `_rc` / `-alpha` / `-beta` / `-dev` 后缀的 tag 判为
          # pre-release;`v0.10.0` 这种裸版本号仍是正式版。写成单行是
          # 刻意的:发布 workflow 挂掉 = 这次没有 release,不值得为排版冒险。
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '_rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-dev') }}
          files: |
            dist/**/*.tar.xz
            dist/**/*.zip
