name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0). Defaults to the latest pushed tag.'
        required: false

permissions:
  contents: write

jobs:
  # [v0.10.4] 版本号守卫。**必须排在 build 之前**:build 会编出二进制、
  # sign 会签、release 会发布 —— 一旦错版发布出去,就是撤不回来的既成事实。
  #
  # 为什么需要它:`wlwl -V` 报的是 `CARGO_PKG_VERSION`(即
  # `impl/Cargo.toml` 的 `[workspace.package] version`),而不是 git tag。
  # 两者靠人记得同步,而这已经**连续漏了三次**:v0.10.1 / v0.10.2 / v0.10.3
  # 的产物全都报 `wlwl 0.10.0`。文档里写几遍口径都没用 —— 写口径的那句本身
  # 就写着「本版不动」,于是它变成了一种**被正式追认的错版**。
  #
  # 规则:**tag 就是权威**。发 `vN.M.P` 之前先把 Cargo 版本改成 `N.M.P`,
  # 本 job 会验证两者一致;不一致直接失败,错版无法发布。
  version-check:
    name: version guard (tag == Cargo version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 本身,`ref` 默认就是被推的那个 tag。
          ref: ${{ github.ref }}

      - name: Compare tag against impl/Cargo.toml [workspace.package] version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO="$(grep -E '^version[[:space:]]*=' impl/Cargo.toml \
                   | head -1 \
                   | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "cargo : $CARGO"
          if [ -z "$CARGO" ]; then
            echo "::error::could not read version from impl/Cargo.toml"
            exit 1
          fi

          # tag 来自三个可能的来源,按可靠性排序。
          # 注意 `workflow_dispatch` 分支下 GITHUB_REF_NAME 是**分支名**而不是
          # tag —— 所以那条路径必须用 input,否则本守卫会把一次合法的手动
          # 触发也判成错版。(顺带说明:该路径下 build/sign 用的仍是
          # GITHUB_REF_NAME,手动触发本来就会把产物名标错,那是既有问题。)
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            TAG="${DISPATCH_TAG}"
          else
            echo "::notice::workflow_dispatch without a 'tag' input — skipping the version guard (an explicit operator override)."
            exit 0
          fi
          echo "tag   : $TAG"

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::notice::'$TAG' is not a vX.Y.Z tag — skipping the version guard."
              exit 0
              ;;
          esac

          # ⚠ [v0.11.3_rc1] **预发布 tag 比的是「基版本」。**
          #
          # `v0.11.3_rc1` 发布的二进制报的是 `wlwl 0.11.3` —— RC 与正式版是
          # **同一份代码**,基版本相同即合法;基版本不同仍然是错版 ⇒ 仍然红。
          # ⚠ 为什么以前没这条:守卫是 v0.10.4 才加的,而那之前**没有任何 RC
          #   tag 存在过**(远端 tag 全是正式版)⇒ 守卫一直没遇到过 RC,而
          #   `v0.11.3_rc1` 会命中 `v[0-9]*.[0-9]*.[0-9]*` ⇒ 守卫照跑 ⇒ 逐字
          #   比较必然不等 ⇒ **任何 RC tag 都过不了这道守卫**(实测)。
          # ⚠ 为什么不能改成「Cargo 版本 = tag 去 v」:下划线**不是合法 semver**
          #   (实测 `cargo metadata` 报 `unexpected character '_' after patch
          #   version number`)⇒ 把 `[workspace.package] version` 写成
          #   `0.11.3_rc1` 会让**全仓每一条 cargo 命令都崩**。
          # ⚠ 后缀集合与下面 release job 的 `prerelease` 表达式**保持一致**
          #   (否则会出现「是预发布却没标」或「标了预发布却按正式版比」)。
          BASE_TAG="$TAG"
          case "$TAG" in
            *[-_]rc*) BASE_TAG="${TAG%%[-_]rc*}" ;;
            *-alpha*) BASE_TAG="${TAG%%-alpha*}" ;;
            *-beta*)  BASE_TAG="${TAG%%-beta*}" ;;
            *-dev*)   BASE_TAG="${TAG%%-dev*}" ;;
          esac
          echo "base  : $BASE_TAG"

          if [ "v$CARGO" != "$BASE_TAG" ]; then
            echo "::error::tag $TAG (base $BASE_TAG) does not match impl/Cargo.toml version $CARGO — the binary would report 'wlwl $CARGO' while being published as $TAG. Set [workspace.package] version = \"${BASE_TAG#v}\" in impl/Cargo.toml, commit, and re-tag."
            exit 1
          fi
          echo "ok: $TAG (base $BASE_TAG) matches Cargo version $CARGO"

  build:
    name: build (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.xz
            binary: wlwl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            binary: wlwl.exe
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install aarch64 cross toolchain (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -y && sudo apt-get install -y gcc-aarch64-linux-gnu

      # impl/Cargo.lock is gitignored, so the very first build of a
      # fresh tag has no lock file. `--locked` refuses to create one,
      # so materialize it here. Subsequent runs (incl. cross-target
      # reuse on the same SHA) hit Swatinem's cache.
      # `shell: bash` because windows-latest defaults to PowerShell,
      # where `if [ ... ]` would be a parser error.
      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release
        working-directory: impl
        env:
          # Force the cross gcc so rust stops invoking host rust-lld,
          # which refuses --fix-cortex-a53-843419 when cross-linking
          # to aarch64-unknown-linux-gnu.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --bin wlwl --target ${{ matrix.target }}

      # [v0.12.1 / 计划 §0 第 4 件] **TLS 扩展产物随发行包发布**。
      #
      # ⚠ 此前 staging **只**放编译器二进制 + R1 stdlib 副本 + 例子 + 源码 tarball
      #   ⇒ **发布包里没有 TLS 动态库**（实测 run #44 建的 release：5 个资产里
      #   没有任何一个是 TLS 动态库）⇒ 计划 §0 第 4 件未完成。
      # ⚠ `wlwl-tls-ext` 是**独立 workspace**（`impl/ext/wlwl-tls-ext/` 自带
      #   Cargo.lock）⇒ 主 workspace 的任何构建都**碰不到**它 ⇒ 这里显式构建。
      #   （它自己的 Cargo.lock **入库** ⇒ `--locked` 可用，依赖集随源码冻结。）
      # ⚠ **必须用同一个 `--target`** ⇒ 否则包里会混进别的架构的动态库。
      # ⚠ aarch64 的交叉 linker 由上面那步的 `env` 给出 —— ⚠ 那步的 env **只**
      #   作用于那一个 step ⇒ 这里**再声明一次**（否则交叉链接会找不到 cc）。
      - name: Build the TLS extension (wlwl-tls cdylib)
        working-directory: impl/ext/wlwl-tls-ext
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip binary (linux/macos)
        if: matrix.archive == 'tar.xz'
        run: |
          # aarch64-linux-gnu is a cross build from x86_64; host `strip`
          # doesn't recognise aarch64 ELF. The cross toolchain we
          # installed above also pulls in binutils-aarch64-linux-gnu,
          # which gives us the right strip.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            strip "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}"
          fi

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "impl/target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          cp "$GITHUB_WORKSPACE/LICENSE" staging/
          cp "$GITHUB_WORKSPACE/README.md" staging/
          cp "$GITHUB_WORKSPACE/CHANGELOG.md" staging/
          mkdir -p staging/examples
          cp -r "$GITHUB_WORKSPACE/impl/examples/." staging/examples/
          # [2026-10-22] **发布包不再含 `docs/` 文件夹** —— 规范已独立成仓
          # (`Laffinty/wlwl-spec-v1`),仓内**不再保留**原先的 `docs/spec/` 与
          # `docs/stdlib/` 两个文件夹;合并后的次级规范 `docs/wlwl-spec-reference.md`
          # 是**仓内专供 AI agent / 机器守卫**读的次级件,**不随包分发**。
          #
          # ⚠ 下面 `staging/lib/stdlib/` **保留**:那是 R1 语言层**源码**的参考
          # 副本(`--std-src` 开发覆盖用),与文档无关 —— 文档是 `docs/`,
          # 源码是 `stdlib/`。删掉它会连带破坏 M1-4 的「产物含 R1 源码副本」。
          #
          # [v0.12.1 / 业主裁决 2026-11-01] **R1 源码副本与 TLS 动态库同居
          # 一个 `lib/` 文件夹**。⇒ 发行包里**只有一个**「库目录」`lib/`,
          #   其下是 `stdlib/`(语言层源码)与那个**动态库文件**本身。
          #   ⚠ **理由**:`wlwl-tls/` 那种「一个动态库自带一个目录」的形态把
          #   **库文件**和**库目录**混为一谈 —— 动态库该和 stdlib 一样归到
          #   `lib/` 底下,消费者找库只需要看一个地方。
          #   ⚠ **ABI_VERSION / SHA256SUMS 放 `lib/` 顶层**(与动态库同级):
          #   它们描述的是**那一个动态库**,不是 `lib/` 整体 ⇒ 不进子目录。
          mkdir -p staging/lib/stdlib
          cp -r "$GITHUB_WORKSPACE/impl/crates/wlwl-std/wl/std/." staging/lib/stdlib/
          cp -r "$GITHUB_WORKSPACE/wlwl-skill" staging/wlwl-skill/

      # [G-06] **把源码树打进发布包** —— 此前发布包只有二进制 + R1 stdlib 副本
      # + 例子 + 文档 ⇒ **没有编译器源码** ⇒ 离线状态下「读源码 / 改这个语言 /
      # 核对某个行为到底怎么实现的」都不可行 ⇒ 用户只能自己去 GitHub 拉 tag
      # 源码（实测 `github.com` 直连超时，得走 `codeload`）。
      #
      # ⇒ 这里随包发一份 `wlwl-src.tar.gz`（**排除构建产物**）＋ 一份
      #   `SOURCE_HASH`（可复算的树哈希）⇒ 「只有发布包的机器」也能离线取到源码。
      # ⚠ 哈希**可复算**：解开 tarball 后 `python script/package_source.py
      #   --verify <src-dir> --hash-file SOURCE_HASH` 就能核对。
      #
      # ⚠ [v0.12.0] **python 必须显式装**：本 job 的矩阵含 `windows-latest`
      #   ⇒ runner 镜像里**不保证**有 `python3` 这个别名（Windows 上只有 `python`）
      #   ⇒ 这里用 `actions/setup-python` 固定一个解释器，再统一用 `python` 调用。
      - name: Set up Python (G-06)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # [v0.12.1 / 计划 §0 第 4 件] 把 **TLS 扩展动态库**装进 staging。
      #
      # ⚠ 放在 `Set up Python` **之后** ⇒ 哈希用 `python` 算：五个矩阵项都有
      #   python，而 `sha256sum` 在 Windows 的 Git Bash 里不保证存在。
      # ⚠ 动态库文件名各平台不同 ⇒ 按 target 分派；名字**保持 cargo 给的**
      #   （`wlwl_tls.dll` / `libwlwl_tls.dylib` / `libwlwl_tls.so`）⇒ 宿主
      #   `wlwl run --ext <path>` 拿到的就是能直接 `dlopen` 的那个文件。
      # ⚠ **ABI 版本随包走**（宿主加载时**必须**校验它）⇒ 从**单一真相**
      #   `impl/crates/wlwl-ext/src/abi.rs` 里读出来，不在 workflow 里写死
      #   （写死 ⇒ 宿主升 ABI 时这里会悄悄过期）。
      # ⚠ **产物缺失就响亮失败** —— 不静默发一个「没有 TLS 动态库」的包
      #   （那正是 run #44 的状态）。
      #
      # [v0.12.1 / 业主裁决 2026-11-01] **动态库与 R1 源码副本同居 `lib/`**:
      #   动态库文件**直接落在 `staging/lib/` 顶层**(不再独占 `wlwl-tls/`
      #   子目录),`ABI_VERSION` / `SHA256SUMS` 与它**同级**。
      #   ⇒ 发行包里只有一个库目录 `lib/`,其下 = `stdlib/`(R1 源码) +
      #     动态库文件 + 它的两个元数据文件。
      # ⚠ **`SHA256SUMS` 里记的是**文件**名(不是路径)** ⇒ 校验必须在
      #   `lib/` 目录里执行(`cd lib && sha256sum -c SHA256SUMS`)⇒ 文档里
      #   的校验命令必须跟着改成这个形状。
      - name: Stage the TLS extension (ABI version + hash)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-windows-*) lib="wlwl_tls.dll" ;;
            *-apple-*)  lib="libwlwl_tls.dylib" ;;
            *)          lib="libwlwl_tls.so" ;;
          esac
          src="impl/ext/wlwl-tls-ext/target/${{ matrix.target }}/release/$lib"
          if [ ! -f "$src" ]; then
            echo "::error::TLS extension artifact missing: $src"
            exit 1
          fi
          # ABI 版本（单一真相 = 宿主侧的 abi.rs；扩展用 #[path] 引用同一份）
          abi=$(sed -n 's/^pub const ABI_VERSION: u32 = \([0-9][0-9]*\);/\1/p' \
                impl/crates/wlwl-ext/src/abi.rs)
          if [ -z "$abi" ]; then
            echo "::error::cannot read ABI_VERSION from impl/crates/wlwl-ext/src/abi.rs"
            exit 1
          fi
          mkdir -p staging/lib
          cp "$src" "staging/lib/$lib"
          printf '%s\n' "$abi" > staging/lib/ABI_VERSION
          # ⚠⚠ **必须用 `sys.stdout.buffer.write`**,不能用 `print()`。
          #   **实测(本机预演,2026-11-01)**:`print()` 在 **Windows** 上把
          #   `\n` 翻译成 `\r\n` ⇒ 产出的 `SHA256SUMS` 是 **CRLF** ⇒
          #   `sha256sum -c SHA256SUMS` 直接 **FAILED**:
          #     `sha256sum: 'wlwl_tls.dll'$'\r': No such file or directory`
          #   ⇒ 也就是说**此前 Windows 的 zip 里那份校验文件是废的**
          #   (Linux/macOS 的 tar.xz 是 LF ⇒ 不受影响)。
          #   ⇒ 走 `.buffer` 写**裸字节** ⇒ 五个平台的 `SHA256SUMS` 都是 LF。
          python -c "import hashlib,sys,os;p=sys.argv[1];h=hashlib.sha256(open(p,'rb').read()).hexdigest();b=os.path.basename(p);sys.stdout.buffer.write((h+'  '+b+'\n').encode('utf-8'))" \
            "$PWD/staging/lib/$lib" > staging/lib/SHA256SUMS
          echo "staged TLS extension: $lib (abi_version=$abi)"
          # ⚠ **布局自检(响亮失败)**:`lib/` 下必须**同时**有 R1 源码副本与
          #   那个动态库 —— 这是本次布局改动的**唯一验收点**。
          #   ⚠ 少一样就红:静默发一个「`lib/` 里只有 stdlib、没有动态库」的包
          #   ⇒ 消费者按文档去找库会找不到(那正是 run #44 的失败形态)。
          # ⚠ **为什么「动态库在不在」这条要看「复制后」**:上一步刚 `cp` 过它
          #   ⇒ 「文件存不存在」在同一脚本里**恒真** ⇒ 那是一条**空转的守卫**
          #   (实测:把复制后的文件删掉,这条检查照样通过)。
          #   ⇒ 真正能抓东西的是**逐字节相等**:复制后的文件必须与源文件
          #     **哈希相同** ⇒ 「cp 了但没 cp 全 / 拷成了别的东西」必红。
          if [ ! -d staging/lib/stdlib ]; then
            echo "::error::staging/lib/stdlib is missing — the R1 source copy did not land next to the TLS dynamic library"
            exit 1
          fi
          if [ ! -f "staging/lib/$lib" ]; then
            echo "::error::staging/lib/$lib is missing — the TLS dynamic library did not land next to the R1 source copy"
            exit 1
          fi
          # ⚠ **复制完整性**:复制后的动态库必须与**源文件**逐字节相等
          #   （哈希对拍）⇒ 抓「cp 没拷全 / 拷成了别的东西」。
          python -c "import hashlib,sys;a=hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest();b=hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest();sys.stdout.write(('copy verified: %s == %s\n'%(a,b)) if a==b else '::error::copy mismatch: src=%s staged=%s\n'%(a,b));sys.exit(0 if a==b else 1)" \
            "$src" "staging/lib/$lib"
          # ⚠ **哈希文件自校验(响亮失败)**:`SHA256SUMS` 必须
          #   ① **无 CR**(纯 LF) ② **哈希与实际文件逐字相等**。
          #   ⚠ 不校验 ⇒ 就可能发出一份「跑 `sha256sum -c` 就红」的校验文件
          #   (Windows 的 CRLF 就是这么溜进去的)。
          # ⚠ **写成单行**:多行 heredoc 会被 YAML 块标量吃掉(缩进一旦跑到
          #   块外,整份 YAML 直接解析失败)⇒ 这里用 `;` 串起来。
          python -c "import hashlib,sys;raw=open(sys.argv[1],'rb').read();h,n=raw.decode('utf-8').split();got=hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest();cr=(b'\r' in raw);ok=((not cr) and got==h);sys.stdout.write(('SHA256SUMS verified: %s -> %s (LF-only)\n'%(n,got)) if ok else ('::error::SHA256SUMS invalid: crlf=%s hash_match=%s\n'%(cr,got==h)));sys.exit(0 if ok else 1)" \
            staging/lib/SHA256SUMS "staging/lib/$lib"
          ls -l staging/lib
          ls -l staging/lib/stdlib

      - name: Package the source tree (G-06)
        shell: bash
        run: |
          set -euo pipefail
          python script/package_source.py \
            --root "$GITHUB_WORKSPACE" \
            --out staging/wlwl-src.tar.gz \
            --hash-out staging/SOURCE_HASH

      - name: Create tar.xz (linux/macos)
        if: matrix.archive == 'tar.xz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="wlwl-${tag}-${TARGET}"
          mv staging "$out"
          tar -cJf "${out}.tar.xz" "$out"
          echo "ASSET=${out}.tar.xz" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Create zip (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $out = "wlwl-$tag-$env:TARGET"
          Move-Item -Path staging -Destination $out
          Compress-Archive -Path "$out\*" -DestinationPath "${out}.zip" -Force
          "ASSET=${out}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  sbom:
    name: generate SBOM (CycloneDX)
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ⚠ [T-09] **从 `Cargo.lock` 确定性生成**，不用 `cargo-cyclonedx`。
      #
      # ⚠ 用 python3（不是 python）：Ubuntu 24.04 默认**没有** python 别名，而本 job 只跑 ubuntu。
      # 理由（release run #45 实测，2026-11-01：那一步红了 ⇒ cosign 与 github release
      # 双双 skipped ⇒ **`v0.12.1_rc2` 的 release 没建成**）：
      #   ① `cargo-cyclonedx 0.5.9` 在本仓**按 crate 各写一份** `sbom.json`
      #      （日志实证：`main SBOM: ./crates/wlwl-toml/sbom.json`）⇒
      #      「workspace 级的那一份」**不存在**，靠 `find` 猜就猜错；
      #   ② 它的落盘位置在 0.5.x 里**不写死**（`--output-file` 已移除）。
      # ⇒ 改成只读 lock（⚠ 只有**扩展**那份是真冻结的：`impl/ext/wlwl-tls-ext/Cargo.lock`
      #   入库；主 workspace 的 `impl/Cargo.lock` 被 .gitignore 忽略、下面现物化 ⇒
      #   只保证「同一次运行内解析结果确定」，**不保证跨运行 / 跨 tag 冻结**），
      #   输出路径**由我们指定** ⇒ 确定性。
      - name: Set up Python (SBOM)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SBOM for the main workspace (from Cargo.lock)
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ `impl/Cargo.lock` 被 .gitignore 忽略、**不入库** ⇒ 干净 clone 上没有它。
          #   这里按仓里既有做法先物化（与 build job 同一段逻辑）。
          cd impl
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cd ..
          mkdir -p impl/target
          # ⚠ 版本号由生成器自己从 `Cargo.toml` 读（`--root-version-from`）——
          #   不要在 bash 里拼 `sed ... | head -1`：`pipefail` 下 SIGPIPE 会返回 141。
          python3 script/gen_sbom.py \
            --lock impl/Cargo.lock \
            --out impl/target/sbom.json \
            --root-name wlwl \
            --root-version-from impl/Cargo.toml
          # ⚠ 上传路径是**相对仓库根**的 ⇒ 必须带 `impl/` 这一层。
          #   历史上这里少了一层，而 upload-artifact 默认 `if-no-files-found: warn`
          #   ⇒ 「上传成功但产物没落盘」⇒ sign job 拿到空 SBOM。
          echo "ASSET_SBOM=impl/target/sbom.json" >> "$GITHUB_ENV"

      - name: Generate SBOM for the TLS extension workspace (from its Cargo.lock)
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ 扩展的 `Cargo.lock` **是入库的** ⇒ 依赖集随源码冻结。
          #   这里**绝不**跑 `cargo generate-lockfile`（那会造出一份不入库的 lock，
          #   依赖集就跟发布物对不上了）⇒ 缺了就响亮失败。
          test -f impl/ext/wlwl-tls-ext/Cargo.lock || {
            echo "::error::impl/ext/wlwl-tls-ext/Cargo.lock is missing (it must be committed)"
            exit 1
          }
          python3 script/gen_sbom.py \
            --lock impl/ext/wlwl-tls-ext/Cargo.lock \
            --out impl/target/sbom-tls-ext.json \
            --root-name wlwl-tls-ext

      - name: Merge the TLS extension SBOM into the main SBOM (and assert coverage)
        shell: bash
        run: |
          set -euo pipefail
          python3 script/gen_sbom.py \
            --merge impl/target/sbom.json impl/target/sbom-tls-ext.json \
            --out impl/target/sbom.json \
            --require rustls,ring,webpki-roots \
            --tls-lock impl/ext/wlwl-tls-ext/Cargo.lock \
            --tls-root-name wlwl-tls-ext

      - name: Verify the SBOM on disk (independent re-read)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys

          SBOM = os.environ.get("ASSET_SBOM", "impl/target/sbom.json")
          LOCK = "impl/ext/wlwl-tls-ext/Cargo.lock"

          def die(msg):
              sys.stderr.write("::error::%s\n" % msg)
              raise SystemExit(1)

          if not os.path.isfile(SBOM):
              die("the SBOM was not written to %s" % SBOM)
          with open(SBOM, encoding="utf-8") as f:
              bom = json.load(f)
          if bom.get("bomFormat") != "CycloneDX":
              die("bomFormat must be CycloneDX, got %r" % bom.get("bomFormat"))
          if bom.get("specVersion") != "1.5":
              die("specVersion must be 1.5, got %r" % bom.get("specVersion"))

          comps = bom.get("components") or []
          if not comps:
              die("the SBOM has no components")
          names = {c.get("name") for c in comps}
          for need in ("rustls", "ring", "webpki-roots"):
              if need not in names:
                  die("required crate %s is MISSING from the SBOM" % need)

          # ⚠ 扩展**本体**不是第三方依赖 ⇒ 不许出现在组件表里。
          if "wlwl-tls-ext" in names:
              die("the TLS extension itself must not be an SBOM component")

          props = {p.get("name"): p.get("value") for p in (bom.get("metadata", {}).get("properties") or [])}
          # ① 合并输入必须**声明**覆盖了扩展
          ws = (props.get("wlwl:sbom:covered-workspaces") or "")
          if "wlwl-tls-ext" not in ws:
              die("the SBOM does not declare TLS extension coverage (covered-workspaces=%r)" % ws)
          # ② 锁文件哈希必须与盘上那份一致 ⇒ 证明「覆盖」是对**这份** lock 做的
          h = hashlib.sha256(open(LOCK, "rb").read()).hexdigest()
          got = props.get("wlwl:sbom:tls-ext-lock-sha256") or ""
          if got != h:
              die("tls-ext-lock-sha256 mismatch: SBOM says %r, on-disk lock is %r" % (got, h))
          # ③ 声称覆盖的扩展包必须**真的**在组件表里（逐包对拍）
          with_pkg = {(c.get("name"), c.get("version")) for c in comps}
          claimed = [x for x in (props.get("wlwl:sbom:tls-ext-packages") or "").split(",") if x]
          if not claimed:
              die("the SBOM claims no TLS extension packages")
          for item in claimed:
              n, _, v = item.rpartition("@")
              if (n, v) not in with_pkg:
                  die("the SBOM claims to cover %s, but that component is missing" % item)

          print("SBOM verified: %d components, %d claimed TLS-ext packages"
                % (len(comps), len(claimed)))
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ env.ASSET_SBOM }}
          # ⚠ 显式 `error`：路径写错 = 这一步红，不许「上传成功但产物没落盘」。
          if-no-files-found: error

  sign:
    name: cosign keyless sign binaries + SBOM
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for sigstore keyless OIDC
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign sign (each binary)
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign sign-blob \
              --output signature \
              --bundle "$asset.bundle" \
              "$asset"
            echo "Signed $asset"
          done

      - name: cosign attach SBOM (predicate)
        shell: bash
        run: |
          set -euo pipefail
          sbom="dist/sbom/sbom.json"
          for asset in dist/wlwl-*.tar.xz dist/wlwl-*.zip; do
            [ -f "$asset" ] || continue
            cosign attach sbom \
              --sbom "$sbom" \
              --signature "$asset.signature" \
              "$asset" || echo "WARN: cosign attach sbom not yet available for $asset"
          done

  conformance:
    # [v0.4 Phase H1] spec section 16.5 conformance gate. Blocks
    # the release job unless every fixture in
    # `impl/tests/conformance/*.wll` runs and emits a well-formed
    # JSONL error envelope (per P4-H1-002/003). Triggered by tag
    # push; workflow_dispatch reuses the same gate.
    name: spec conformance suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # [D13-053] 工具链钉死在仓根 `rust-toolchain.toml`;这里用 rustup 本尊而非
      # `dtolnay/rust-toolchain@stable`(后者未传 `toolchain:` 时默认匹配 `@rev`、
      # **不读**那个文件)。理由见 ci.yml 的 test job。
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        shell: bash
        run: |
          test -f rust-toolchain.toml || { echo "::error::rust-toolchain.toml missing"; exit 1; }
          rustup toolchain install --profile default
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Materialize Cargo.lock (if missing)
        shell: bash
        working-directory: impl
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: cargo build --release --bin wlwl
        working-directory: impl
        run: cargo build --locked --release --bin wlwl

      - name: cargo test --test conformance -p wlwl-cli
        working-directory: impl
        run: cargo test --locked --test conformance -p wlwl-cli

  release:
    name: github release
    needs: [build, sbom, sign, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # [v0.10.0_rc1] 预发布标记按 tag 名算,不让 RC 冒充正式版。
          # 之前这里没传 `prerelease`,action 默认建**正式** release ——
          # 于是 `v0.10.0_rc1` 会被工具链当成 production ready 抓走。
          # 用表达式而不是 action 的 `auto` 值:`prerelease` 文档里只承诺
          # Boolean,`auto` 的推导规则未在 v2 上核实过。
          # 带 `-rc` / `_rc` / `-alpha` / `-beta` / `-dev` 后缀的 tag 判为
          # pre-release;`v0.10.0` 这种裸版本号仍是正式版。写成单行是
          # 刻意的:发布 workflow 挂掉 = 这次没有 release,不值得为排版冒险。
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '_rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-dev') }}
          # ⚠ [T-09] **SBOM 必须是发布资产**，不能只当 workflow artifact：
          #   审计的验收句是「**release 的 SBOM 资产**里含 rustls / ring /
          #   webpki-roots」—— artifact 要登录才能下（`GET /actions/artifacts`
          #   = 401）⇒ 只有挂成资产，消费者才**匿名可查**。
          # ⚠ `dist/sbom/sbom.json` 来自 `sbom` job 的 artifact（名 `sbom`）：
          #   `download-artifact` 把每个 artifact 解到**以它自己命名的子目录**下。
          # ⚠ 说明写在这里（YAML 注释），**不能**写进 `files: |` 块内 ——
          #   那个块是**逐行 glob**，`#` 开头的行会被当成字面模式；
          #   配上 `fail_on_unmatched_files: true` 就有被判红的风险。
          files: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/sbom/sbom.json
