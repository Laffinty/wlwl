# [D13-053] 工具链**钉死**。
#
# 此前 CI 用 `dtolnay/rust-toolchain@stable`、仓内**没有任何 pin** ⇒ 本地
# `stable` 可以停在任意旧版本而 CI 早已是最新,于是出现「**本地六项门禁全绿、
# CI 全红**」,而且**发现它的人与引入它的人无关**。
#
# 2026-10-15 实际发生:本地 **1.96.0** / CI **1.99.0** ⇒ `map_or_identity` 与
# `for_kv_map` 两条 lint 让 macos / ubuntu / windows **三平台同时变红**,而那
# 两行代码早已存在(与当轮改动无关 —— 见 §9 台账 D13-053)。
#
# ## 取舍
# **好处**:工具链变更变成一次**可审阅的显式提交**;本地与 CI 恒等;「谁发了个
# rustc 版本把主干打红」这种事故不再发生。
# **代价**:新的 clippy lint **不会自动出现** —— 要用就先有意升级这个文件。
# 本仓的门禁纪律是「**契约 / 门禁必须钉住行为**」,不是「lint 全自动收到」,
# 所以这笔交换与本仓取向一致。
#
# ## 升级方式
# 只改下面这一行,**单独开一笔提交** —— 让 diff 里只有版本号,便于回看
# 「哪次工具链升级带来了哪些 lint 变化」。
#
# ⚠ 与 `impl/Cargo.toml` 的 `rust-version`（MSRV，1.85）是**两件事**：
# 那是「最低能编译的版本」的下限承诺；本文件是「大家实际用哪个」。
# ⚠ **MSVR 目前没有任何门禁在检查**（见 §9 台账 `D13-013`）—— 那是另一个
# 待立项的缺口，不要以为钉了本文件就顺带解决了它。

[toolchain]
channel = "1.99.0"
