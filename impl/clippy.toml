# [v0.2 Phase G1] workspace-level clippy configuration.
#
# Strategy: prefer "lint allow with rationale" over mass rewrites when
# the warning reflects a deliberate design choice (e.g. `WlwlError`
# carries full diagnostic info by spec §14.2). Mechanical lints are
# fixed in-tree; complex architectural ones are documented in
# `docs/history/deviations-v0.7.md` under P4-G1-* and allowed at the call site.

# --- complexity thresholds -----------------------------------------------
# Default is 250; the interpreter's `eval_expr` recursive walk has
# natural cyclomatic complexity (one branch per AST variant). Bump to
# 350 to allow the per-variant dispatch without splitting into helpers
# purely to placate clippy. Plan §3 G1 allows this as a "warn level
# customization" decision.
cognitive-complexity-threshold = 50

# --- pedantic off-by-default ---------------------------------------------
# Disable pedantic lints that are too aggressive for a small language
# interpreter where the natural shape of the code already satisfies them.
# Re-enable individually when justified.
disallowed-methods = []
avoid-breaking-exported-api = false

# --- enforce style preferences shared by the team -------------------------
# `cognitive-complexity-threshold` is the most important: anything else
# added here should have a specific incident in `deviations.md` §G
# backing the choice.

# [v0.2 Phase G1 P4-G1-007] result_large_err is allow-by-default at the
# workspace level: `WlwlError` is large by design (carries spec §14.2
# diagnostic schema with trace + cause + location + suggestion). Reducing
# its size would require restructuring the error type, which is out of
# scope for G1. Allowed at module level in `wlwl-error/src/lib.rs` via
# `#[allow(clippy::result_large_err)]` on each `Result<_, WlwlError>`
# return site. See deviations.md §Phase G P4-G1-007.