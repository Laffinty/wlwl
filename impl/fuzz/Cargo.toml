# [v0.2 Phase G6] cargo-fuzz harness.
#
# This file lives OUTSIDE the workspace members list (cargo-fuzz
# convention). It sits at `impl/fuzz/` so it is NOT enumerated in
# `impl/Cargo.toml [workspace] members = [...]`. Sanitizer builds
# are mutually exclusive with the regular `[lints] workspace = true`
# strictness, hence the separation.
#
# To run (nightly required; libFuzzer backend):
#
#     cargo +nightly install cargo-fuzz --locked
#     cd impl/fuzz
#     cargo +nightly fuzz run fuzz_target_lexer
#     cargo +nightly fuzz run fuzz_target_parser
#     cargo +nightly fuzz run fuzz_target_eval
#
# Per P4-G6-001 we do NOT run fuzz in CI nightly (~hours per target
# vs ~30 s for the rest of CI). Local devs invoke `cargo +nightly
# fuzz run <target>` periodically.

[package]
name = "wlwl-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# [v0.10.3] 空的 `[workspace]` 表 —— cargo-fuzz 的标准约定,用来把本 crate
# 排除在 `impl/Cargo.toml` 的 workspace 之外。
#
# 缺了它 cargo 会直接拒绝:「current package believes it's in a workspace
# when it's not」。也就是说在本批之前,这个 crate 有**第四处**无法编译的
# 原因(前四处:缺 `libfuzzer-sys`、`tokenize` 不存在、`parse` 签名不对、
# `set_max_steps` / `run_program` 不存在)。
#
# 本表同时也是「本 crate 不继承 workspace 的 `[lints] workspace = true` 严格性」
# 这一说法的兑现 —— 上面注释里那句「Sanitizer 构建与常规 lints 互斥」正靠它成立。
[workspace]

[[bin]]
name = "fuzz_target_lexer"
path = "fuzz_targets/lexer.rs"

[[bin]]
name = "fuzz_target_parser"
path = "fuzz_targets/parser.rs"

[[bin]]
name = "fuzz_target_eval"
path = "fuzz_targets/eval.rs"

[dependencies]
# Workspace path crates — pulled in directly (NOT via `workspace = true`
# inheritance because the fuzz crate is not a workspace member).
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# [v0.10.3] **这一条以前是缺的。** 三个 target 全部 `use libfuzzer_sys::…`,
# 而依赖表里没有它 —— 注释写着「首次 `cargo fuzz init` 时会自动加上」,
# 而那次 init 从没发生过。也就是说 `impl/fuzz` **从来编译不过**,
# 「我们有 fuzz」是不成立的。显式声明之后这个 crate 才真的能用。
libfuzzer-sys = "0.4"

wlwl-ast = { path = "../crates/wlwl-ast" }
wlwl-error = { path = "../crates/wlwl-error" }
wlwl-eval = { path = "../crates/wlwl-eval" }
wlwl-lexer = { path = "../crates/wlwl-lexer" }
wlwl-parser = { path = "../crates/wlwl-parser" }

[profile.release]
debug = 1   # symbol info for crash triage and coverage reports
