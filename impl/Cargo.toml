[workspace]
resolver = "2"
members = [
    "crates/wlwl-value",
    "crates/wlwl-std",
    "crates/wlwl-toml",
    "crates/wlwl-ast",
    "crates/wlwl-lexer",
    "crates/wlwl-parser",
    "crates/wlwl-error",
    "crates/wlwl-eval",
    "crates/wlwl-formatter",
    "crates/wlwl-cli",
    "crates/wlwl-types",
]

[workspace.package]
# [v0.10.4] `wlwl -V` 报的就是这个值(clap 的 `#[command(version)]` 取
# `CARGO_PKG_VERSION`)。它必须**跟着发布版本走**。
#
# 此前这里停在 `0.10.0`,于是 v0.10.1 / v0.10.2 / v0.10.3 三个发布物全都报
# `wlwl 0.10.0` —— 连续三次。靠「文档里写清口径」拦不住:那条口径本身写的
# 就是「本版不动」,等于把错版正式追认了。
#
# 规则:**发 vN.M.P 之前先把这个数改成 N.M.P**。`.github/workflows/release.yml`
# 的 `version-check` job 会在**打包之前**验证 tag 与本值一致,不一致直接失败 ——
# 所以现在漏改的后果是「发不出去」,而不是「发出去一个说谎的二进制」。
version = "0.11.3"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/Laffinty/wlwl"
rust-version = "1.85"

# [v0.2 Phase G1] workspace-level lints.
#
# `result_large_err` is allowed workspace-wide: `WlwlError` carries the
# full spec 鎼?4.2 diagnostic schema (trace + cause + location +
# suggestion + related), making it ~240 bytes by construction.
# Restructuring it (e.g. Box-ing) would degrade error ergonomics and
# is out of scope for G1; see deviations.md P4-G1-001.
[workspace.lints.clippy]
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
insta = { version = "1.40", features = ["json"] }
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

# [v0.11.3 M6 / W-03] Argon2id, backing `std.encode` ARGON2ID.
#
# Feature set is narrowed deliberately (D10-011 discipline: pin it, do not
# take the defaults and hope):
#   - `default-features = false` drops `getrandom` (we never ask Argon2 for
#     random salts; salt generation is `RANDOM_HEX`, a member of std.encode)
#     and `password-hash` (we are a KDF, not a password-hash-string API).
#   - `alloc` is the whole feature list. `kdf` was tried and removed: it
#     unlocks `Kdf::derive_key`, which turns out to be `hash_password_into`
#     with no associated-data parameter at all, so it buys us nothing
#     (addendum-04 section 3.5). `parallel` is likewise not enabled: it is
#     the one flag that would let a single call spawn a thread pool sized by
#     `p_cost`, and W-01 already caps p_cost at 16.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# [v0.11.3 M6 / W-04] CSPRNG entropy for `RANDOM_BYTES` / `RANDOM_HEX`.
#
# Hand-rolling OS entropy reads is not an option: a home-grown CSPRNG in a
# language standard library is a supply-chain hazard wearing our name, so we
# call the platform and nothing else. `getrandom` is RustCrypto's own crate
# (MIT OR Apache-2.0) and is a thin syscall wrapper -- `getrandom(2)` on
# Linux, `RtlGenRandom` on Windows, and no userspace fallback.
#
# **Pinned to 0.3, not 0.4, on purpose.** `getrandom` 0.4 declares
# `rust-version = "1.85"` and `edition = "2024"`, so taking the newest release
# would raise *our* edition floor for no gain — 0.3.4 declares 1.63 / edition
# 2021 and exposes the same `fill()` entry point.
#
# ⚠️ **[D13-013, 2026-10-08] 这条注释原本的理由是「工作区承诺 1.75,取 0.4 会把
# 那个承诺变成谎言」—— 而那个承诺**当时就已经是假的**:把改动 stash 掉、从零解算,
# `getrandom 0.4.3` **本来就在树里**(dev 链 `insta` -> `tempfile`)。**钉住直接依赖
# 并没有把 0.4 挡在图外。** 现 `rust-version` 已按实测改为 `1.85`(见上),本条
# 钉版本的**理由从「守 MSRV 承诺」改成「不无谓抬高 edition 下限」。**
#
# Bump this together with `rust-version`, not on its own.
#
# `default-features = false` drops `std` and, importantly, `sys_rng` (a
# thread-local *non-cryptographic* fallback that must never be reachable from
# a CSPRNG member).
getrandom = { version = "0.3", default-features = false }

# [v0.11.3 M6 / addendum-07] `std.compress` 的两个后端。**这是本工作区第一次
# 引入压缩依赖**,所以「要不要引」本身被当成一个取舍核过一遍(addendum-07
# §3.1),结论是引:
#
#   * zstd 压缩端**手写不可行**(FSE / Huffman / 块划分,周级工作量且正确性
#     极难自证)⇒ 必须引。
#   * 「引入 C 依赖不是先例破坏」:`ring`(C + 汇编)已经经 `rustls` <- `reqwest`
#     <- `std.ai` **在依赖树里**了,`zstd-sys` 属同一类,不是新的一类成本。
#   * 自研 DEFLATE **解压端**是压缩炸弹 / OOB / 无界分配的第一现场 —— 而本份自己
#     要写一条「解压输出上限」规范条款,说明这面攻击是真的 ⇒ 最不该自担。
#   * flate2 默认走**纯 Rust** 后端 `miniz_oxide`(零 C),所以 RFC 1950/1951/1952
#     三条线不引入新的 C 依赖。
#
# 版本按「钉住、不裸取最新版」的纪律显式给,与 `getrandom` / `argon2` 同款。
zstd = { version = "0.13", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# 閺堫剙浼愭担婊呪敄闂傛潙鍞撮柈?crate
#
# [v0.11 / D10-011] 每条都补了 `version`,与上面的 `[workspace.package]
# version` **同值**。此前这 10 条只写 `path`,cargo 把版本要求解析成通配 `*`
# —— 于是 `deny.toml` 的 `wildcards = "deny"` 直接报
# `error[wildcard]`,整条 CI 的 cargo-deny 门禁从此红。`wlwl-types` 在
# [v0.10] Step 1 撞到过同一个错、当时的处置是加一条 `skip` 兜住,而
# `wlwl-value`(v0.11 M2 新增)漏了 —— CI 此前只触发 `main`,cargo-deny
# 一直没被验到,直到 wip0.11 纳入触发列表。
#
# 补 `version` 的额外好处:**漂移会响**。`path` 与 `version` 对不上时
# cargo 直接解析失败,而只写 `path` 时版本要求是通配的、错了也不吭声。
#
# 发布时这些 `version` 必须与上面 `[workspace.package] version` 一起改
# (release.yml 的 `version-check` 已经在校后者;前者漏改会在下一次
# `cargo build` 时立刻炸,不会静默发出去)。
wlwl-value = { version = "0.11.3", path = "crates/wlwl-value" }
wlwl-std = { version = "0.11.3", path = "crates/wlwl-std" }
wlwl-toml = { version = "0.11.3", path = "crates/wlwl-toml" }
wlwl-ast = { version = "0.11.3", path = "crates/wlwl-ast" }
wlwl-lexer = { version = "0.11.3", path = "crates/wlwl-lexer" }
wlwl-parser = { version = "0.11.3", path = "crates/wlwl-parser" }
wlwl-error = { version = "0.11.3", path = "crates/wlwl-error" }
wlwl-eval = { version = "0.11.3", path = "crates/wlwl-eval" }
wlwl-formatter = { version = "0.11.3", path = "crates/wlwl-formatter" }
# v0.10 Step 1 (ADR-0020 A1): static type layer. Leaf crate -- depends on
# wlwl-ast only, and is deliberately NOT a dependency of wlwl-eval.
wlwl-types = { version = "0.11.3", path = "crates/wlwl-types" }


[profile.test]
# Phase D: with 100+ tests the default per-test codegen units
# generate too many .rcgu.o files for the MSVC linker to handle
# in one command line on Windows (os error 1450). One codegen
# unit per crate keeps the link command line short.
codegen-units = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# [v0.2 Phase F1] criterion benchmarks. debug = true keeps the
# inlined `eval_expr` symbols available for flamegraph attribution
# (Phase F2); opt-level = 3 makes the timings representative of
# release-mode throughput, which is what Phase G8 will gate on.
[profile.bench]
debug = true
opt-level = 3
