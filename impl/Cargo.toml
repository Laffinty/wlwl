[workspace]
resolver = "2"
members = [
    "crates/wlwl-std",
    "crates/wlwl-toml",
    "crates/wlwl-ast",
    "crates/wlwl-lexer",
    "crates/wlwl-parser",
    "crates/wlwl-error",
    "crates/wlwl-eval",
    "crates/wlwl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
repository = "https://github.com/wlwl-lang/wlwl"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
insta = { version = "1.40", features = ["json"] }
toml = "0.8"

# 本工作空间内部 crate
wlwl-std = { path = "crates/wlwl-std" }
wlwl-toml = { path = "crates/wlwl-toml" }
wlwl-ast = { path = "crates/wlwl-ast" }
wlwl-lexer = { path = "crates/wlwl-lexer" }
wlwl-parser = { path = "crates/wlwl-parser" }
wlwl-error = { path = "crates/wlwl-error" }
wlwl-eval = { path = "crates/wlwl-eval" }

[profile.release]
lto = "thin"
codegen-units = 1
