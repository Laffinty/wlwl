[workspace]
resolver = "2"
members = [
    "crates/wlwl-std",
    "crates/wlwl-toml",
    "crates/wlwl-ast",
    "crates/wlwl-lexer",
    "crates/wlwl-parser",
    "crates/wlwl-error",
    "crates/wlwl-eval",
    "crates/wlwl-formatter",
    "crates/wlwl-cli",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/Laffinty/wlwl"
rust-version = "1.75"

# [v0.2 Phase G1] workspace-level lints.
#
# `result_large_err` is allowed workspace-wide: `WlwlError` carries the
# full spec 鎼?4.2 diagnostic schema (trace + cause + location +
# suggestion + related), making it ~240 bytes by construction.
# Restructuring it (e.g. Box-ing) would degrade error ergonomics and
# is out of scope for G1; see deviations.md P4-G1-001.
[workspace.lints.clippy]
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
insta = { version = "1.40", features = ["json"] }
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

# 閺堫剙浼愭担婊呪敄闂傛潙鍞撮柈?crate
wlwl-std = { path = "crates/wlwl-std" }
wlwl-toml = { path = "crates/wlwl-toml" }
wlwl-ast = { path = "crates/wlwl-ast" }
wlwl-lexer = { path = "crates/wlwl-lexer" }
wlwl-parser = { path = "crates/wlwl-parser" }
wlwl-error = { path = "crates/wlwl-error" }
wlwl-eval = { path = "crates/wlwl-eval" }
wlwl-formatter = { path = "crates/wlwl-formatter" }


[profile.test]
# Phase D: with 100+ tests the default per-test codegen units
# generate too many .rcgu.o files for the MSVC linker to handle
# in one command line on Windows (os error 1450). One codegen
# unit per crate keeps the link command line short.
codegen-units = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# [v0.2 Phase F1] criterion benchmarks. debug = true keeps the
# inlined `eval_expr` symbols available for flamegraph attribution
# (Phase F2); opt-level = 3 makes the timings representative of
# release-mode throughput, which is what Phase G8 will gate on.
[profile.bench]
debug = true
opt-level = 3
