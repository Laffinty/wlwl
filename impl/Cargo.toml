[workspace]
resolver = "2"
members = [
    "crates/wlwl-value",
    "crates/wlwl-std",
    "crates/wlwl-toml",
    "crates/wlwl-ast",
    "crates/wlwl-lexer",
    "crates/wlwl-parser",
    "crates/wlwl-error",
    "crates/wlwl-eval",
    "crates/wlwl-formatter",
    "crates/wlwl-cli",
    "crates/wlwl-types",
]

[workspace.package]
# [v0.10.4] `wlwl -V` 报的就是这个值(clap 的 `#[command(version)]` 取
# `CARGO_PKG_VERSION`)。它必须**跟着发布版本走**。
#
# 此前这里停在 `0.10.0`,于是 v0.10.1 / v0.10.2 / v0.10.3 三个发布物全都报
# `wlwl 0.10.0` —— 连续三次。靠「文档里写清口径」拦不住:那条口径本身写的
# 就是「本版不动」,等于把错版正式追认了。
#
# 规则:**发 vN.M.P 之前先把这个数改成 N.M.P**。`.github/workflows/release.yml`
# 的 `version-check` job 会在**打包之前**验证 tag 与本值一致,不一致直接失败 ——
# 所以现在漏改的后果是「发不出去」,而不是「发出去一个说谎的二进制」。
version = "0.10.4"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/Laffinty/wlwl"
rust-version = "1.75"

# [v0.2 Phase G1] workspace-level lints.
#
# `result_large_err` is allowed workspace-wide: `WlwlError` carries the
# full spec 鎼?4.2 diagnostic schema (trace + cause + location +
# suggestion + related), making it ~240 bytes by construction.
# Restructuring it (e.g. Box-ing) would degrade error ergonomics and
# is out of scope for G1; see deviations.md P4-G1-001.
[workspace.lints.clippy]
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
insta = { version = "1.40", features = ["json"] }
toml = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

# 閺堫剙浼愭担婊呪敄闂傛潙鍞撮柈?crate
#
# [v0.11 / D10-011] 每条都补了 `version`,与上面的 `[workspace.package]
# version` **同值**。此前这 10 条只写 `path`,cargo 把版本要求解析成通配 `*`
# —— 于是 `deny.toml` 的 `wildcards = "deny"` 直接报
# `error[wildcard]`,整条 CI 的 cargo-deny 门禁从此红。`wlwl-types` 在
# [v0.10] Step 1 撞到过同一个错、当时的处置是加一条 `skip` 兜住,而
# `wlwl-value`(v0.11 M2 新增)漏了 —— CI 此前只触发 `main`,cargo-deny
# 一直没被验到,直到 wip0.11 纳入触发列表。
#
# 补 `version` 的额外好处:**漂移会响**。`path` 与 `version` 对不上时
# cargo 直接解析失败,而只写 `path` 时版本要求是通配的、错了也不吭声。
#
# 发布时这些 `version` 必须与上面 `[workspace.package] version` 一起改
# (release.yml 的 `version-check` 已经在校后者;前者漏改会在下一次
# `cargo build` 时立刻炸,不会静默发出去)。
wlwl-value = { version = "0.10.4", path = "crates/wlwl-value" }
wlwl-std = { version = "0.10.4", path = "crates/wlwl-std" }
wlwl-toml = { version = "0.10.4", path = "crates/wlwl-toml" }
wlwl-ast = { version = "0.10.4", path = "crates/wlwl-ast" }
wlwl-lexer = { version = "0.10.4", path = "crates/wlwl-lexer" }
wlwl-parser = { version = "0.10.4", path = "crates/wlwl-parser" }
wlwl-error = { version = "0.10.4", path = "crates/wlwl-error" }
wlwl-eval = { version = "0.10.4", path = "crates/wlwl-eval" }
wlwl-formatter = { version = "0.10.4", path = "crates/wlwl-formatter" }
# v0.10 Step 1 (ADR-0020 A1): static type layer. Leaf crate -- depends on
# wlwl-ast only, and is deliberately NOT a dependency of wlwl-eval.
wlwl-types = { version = "0.10.4", path = "crates/wlwl-types" }


[profile.test]
# Phase D: with 100+ tests the default per-test codegen units
# generate too many .rcgu.o files for the MSVC linker to handle
# in one command line on Windows (os error 1450). One codegen
# unit per crate keeps the link command line short.
codegen-units = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# [v0.2 Phase F1] criterion benchmarks. debug = true keeps the
# inlined `eval_expr` symbols available for flamegraph attribution
# (Phase F2); opt-level = 3 makes the timings representative of
# release-mode throughput, which is what Phase G8 will gate on.
[profile.bench]
debug = true
opt-level = 3
