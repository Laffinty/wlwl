[package]
name = "wlwl-std"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL standard library (Phase 4 搂15: std.io / std.fs / std.json / std.ai / std.format / std.agent)"

[dependencies]
wlwl-ast = { workspace = true }
wlwl-value = { workspace = true }
wlwl-error = { workspace = true }
serde_json = { workspace = true }

# Optional: real LLM HTTP integration (Phase D1, spec v0.4 搂15.13).
# `cargo build --features wlwl-std/real-ai` pulls reqwest + enables
# the real HTTP path in `ai.rs`. Default builds stay small / offline.
# The mock path in `ai.rs` works without this feature and is what
# the unit tests exercise.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
# Default: mock-only build (offline, no reqwest). Tests + CI use this.
default = []
# `cargo build --features wlwl-std/real-ai` to enable real HTTP.
#
# [D11-019] 这条路径从 v0.4 起就没被编译过 —— M2 把 `StdCtx` 搬进
# `wlwl-value` 时静默丢掉了 `#[cfg(feature = "real-ai")] http_client`,
# 同一处还藏着一个 E0502 借用冲突。默认构建不带该 feature,所以 1824 项
# 测试全绿也照不出来。两处均已修好,client 缓存改放进程内 `OnceLock`
# (见 `src/ai.rs` 的 `real` 模块);`ci.yml` 现有一道
# `cargo check --features wlwl-std/real-ai` 专门守它 —— 改这条路径时
# 别只跑默认构建。
real-ai = ["dep:reqwest"]

[lints]
workspace = true
