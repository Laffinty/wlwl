[package]
name = "wlwl-std"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL standard library (Phase 4 搂15: std.io / std.fs / std.json / std.ai / std.format / std.agent)"

[dependencies]
wlwl-ast = { workspace = true }
wlwl-value = { workspace = true }
wlwl-error = { workspace = true }
serde_json = { workspace = true }
# [v0.11.3 M6 / W-03] ARGON2ID. Feature narrowing is documented in the
# workspace `Cargo.toml`; do not widen it here without re-reading that note.
argon2 = { workspace = true }
# [v0.11.3 M6 / W-04] OS entropy for RANDOM_BYTES / RANDOM_HEX. Feature
# narrowing is documented in the workspace `Cargo.toml`; do not widen it here
# without re-reading that note.
getrandom = { workspace = true }
# [v0.11.3 M6 / addendum-07] Zstandard (RFC 8878) + DEFLATE/zlib/gzip
# (RFC 1950/1951/1952). Feature narrowing and the "why a crate and not
# a hand-rolled codec" reasoning are in the workspace `Cargo.toml`.
zstd = { workspace = true }
flate2 = { workspace = true }

# Optional: real LLM HTTP integration (Phase D1, spec v0.4 搂15.13).
# `cargo build --features wlwl-std/real-ai` pulls reqwest + enables
# the real HTTP path in `ai.rs`. Default builds stay small / offline.
# The mock path in `ai.rs` works without this feature and is what
# the unit tests exercise.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }

# [N-037 项三 / D13-068] `std.process` 超时时**按进程组杀整棵后代**。
#
# 拆开看只有**两个**动作要跨平台:
#   * 设组 —— `std::os::unix::process::CommandExt::process_group(0)`
#     (1.64 起 stable,等价 `setpgid(0,0)`)⇒ **纯标准库,不需要依赖**;
#   * 杀整组 —— `killpg` / `kill(-pgid, SIGKILL)` ⇒ **标准库没有**,只能靠 libc。
# 所以这里只为了**那一个系统调用**引 libc。
#
# ⚠ 它此前已在本仓的**传递**依赖里(`impl/Cargo.lock` 的 libc 0.2.190,
#   dev 链 `insta -> tempfile` 等),提成**直接**依赖几乎不扩大依赖面;
#   `Cargo.lock` 只多一条依赖边,不升级任何版本。
# ⚠ 按 `cfg(unix)` 声明:Windows 侧的等价机制是 `taskkill /T /F`(进程树),
#   不需要 libc。版本按本仓纪律**显式给**(deny.toml `wildcards = "deny"`)。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Default: mock-only build (offline, no reqwest). Tests + CI use this.
default = []
# `cargo build --features wlwl-std/real-ai` to enable real HTTP.
#
# [D11-019] 这条路径从 v0.4 起就没被编译过 —— M2 把 `StdCtx` 搬进
# `wlwl-value` 时静默丢掉了 `#[cfg(feature = "real-ai")] http_client`,
# 同一处还藏着一个 E0502 借用冲突。默认构建不带该 feature,所以 1824 项
# 测试全绿也照不出来。两处均已修好,client 缓存改放进程内 `OnceLock`
# (见 `src/ai.rs` 的 `real` 模块);`ci.yml` 现有一道
# `cargo check --features wlwl-std/real-ai` 专门守它 —— 改这条路径时
# 别只跑默认构建。
real-ai = ["dep:reqwest"]

[lints]
workspace = true
