[package]
name = "wlwl-eval"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL tree-walking interpreter (Phase 3: full v0.3 with type-annotation slots)"

[dependencies]
wlwl-ast = { workspace = true }
wlwl-value = { workspace = true }
wlwl-error = { workspace = true }
wlwl-parser = { workspace = true }
wlwl-std = { workspace = true }
wlwl-toml = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wlwl-parser = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "eval_hot_paths"
harness = false
path = "benches/eval_hot_paths.rs"
[[bin]]
name = "gen-appendix-g"
path = "src/bin/gen_appendix_g.rs"
[[bin]]
name = "gen-appendix-a"
path = "src/bin/gen_appendix_a.rs"
[lints]
workspace = true
[[bench]]
name = "sanitize"
harness = false
path = "benches/sanitize.rs"
[[bench]]
name = "encode"
harness = false
path = "benches/encode.rs"
[[bench]]
name = "collection"
harness = false
path = "benches/collection.rs"
# [v0.11.3 M6 / W-05] KDF / 熵源 / 常数时间比较的 release 读数。
# 与 encode 段分开:KDF 的成本**就是**它的价值,而 encode 段是 §7.4 的
# 吞吐指标,两者不构成同一条曲线。
[[bench]]
name = "kdf"
harness = false
path = "benches/kdf.rs"
# [v0.11.3 M6 / W-04] 正则基准 —— **复杂度契约的 release 读数**。机制部分
# 在契约表里,阈值只能在这里钉(计时断言写进 cargo test 必然抖动)。
[[bench]]
name = "regex"
harness = false
path = "benches/regex.rs"
# [v0.11.3 M6 / addendum-08 W-04] `std.rand` 基准 —— **量「`DICT` 状态的代价」**
# 这个具体疑问(ADR-0027 A2 明写「字典构造要进基准,不得假设它免费」)。
# 与 kdf / regex 段分开:那两段量的是**算法**成本,这一段量的是**表示方式**的
# 成本(成员路径 vs 绕过 dict 的同一序列)。
[[bench]]
name = "rand"
harness = false
path = "benches/rand.rs"
