[package]
name = "wlwl-eval"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL tree-walking interpreter (Phase 3: full v0.3 with type-annotation slots)"

[dependencies]
wlwl-ast = { workspace = true }
wlwl-value = { workspace = true }
wlwl-error = { workspace = true }
wlwl-parser = { workspace = true }
wlwl-std = { workspace = true }
wlwl-toml = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
wlwl-parser = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "eval_hot_paths"
harness = false
path = "benches/eval_hot_paths.rs"
[[bin]]
name = "gen-appendix-g"
path = "src/bin/gen_appendix_g.rs"
[[bin]]
name = "gen-appendix-a"
path = "src/bin/gen_appendix_a.rs"
[lints]
workspace = true
[[bench]]
name = "sanitize"
harness = false
path = "benches/sanitize.rs"
[[bench]]
name = "encode"
harness = false
path = "benches/encode.rs"
[[bench]]
name = "collection"
harness = false
path = "benches/collection.rs"
# [v0.11.3 M6 / W-05] KDF / 熵源 / 常数时间比较的 release 读数。
# 与 encode 段分开:KDF 的成本**就是**它的价值,而 encode 段是 §7.4 的
# 吞吐指标,两者不构成同一条曲线。
[[bench]]
name = "kdf"
harness = false
path = "benches/kdf.rs"
# [v0.11.3 M6 / W-04] 正则基准 —— **复杂度契约的 release 读数**。机制部分
# 在契约表里,阈值只能在这里钉(计时断言写进 cargo test 必然抖动)。
[[bench]]
name = "regex"
harness = false
path = "benches/regex.rs"
# [v0.11.3 M6 / addendum-08 W-04] `std.rand` 基准 —— **量「`DICT` 状态的代价」**
# 这个具体疑问(ADR-0027 A2 明写「字典构造要进基准,不得假设它免费」)。
# 与 kdf / regex 段分开:那两段量的是**算法**成本,这一段量的是**表示方式**的
# 成本(成员路径 vs 绕过 dict 的同一序列)。
[[bench]]
name = "rand"
harness = false
path = "benches/rand.rs"
# [v0.11.3 M7 / ADR-0032 §7-S4] L0-B 可变累加器基准 —— **D3 三件套的第二件**。
# 另建文件而不并进 collection.rs:那里的 `r1_build_*` 走 FOR + 闭包,而识别器只在
# `eval_while` 上调用 ⇒ 那一组永远判否,拿它守 L0-B 会得到一个「怎么都不变」的
# 绿色读数。四组里 `l0b_control` 是对照组(只多一句 `LEN(acc)` ⇒ 识别判否),
# 用来把「优化生效」与「解释器整体变快」区分开。
[[bench]]
name = "accumulator"
harness = false
path = "benches/accumulator.rs"
# [v0.11.3 M7 / addendum-10 W-07] `std.math` 统计族九成员的规模基准。
# 另起文件:语料必须**乱序**(固定种子 LCG)—— `MEDIAN` / `PERCENTILE` 要排序,
# 而 pdqsort 对已升序输入有快路径,`RANGE(0,n,1)` 会低估它们并让形状读数失真。
[[bench]]
name = "stats"
harness = false
path = "benches/stats.rs"
# [v0.11.3 M7 / addendum-09 W-06] `std.json` 规模基准 + **规模契约**
# (1 MB 上每字节成本与 1 KB 持平 —— 那是 00 治本之后第一次可以真正验的一条)。
# ⚠ `json_get` 那一组**必然随文档变大而下降**:`Value::Dict` 是线性扫描
# (`ADR-0025` Q1 裁定本批不动它)。计划 §4 那条「≥ 100 MB/s」只能按小档读。
[[bench]]
name = "json"
harness = false
path = "benches/json.rs"
