[package]
name = "wlwl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL command-line interface"

[[bin]]
name = "wlwl"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
wlwl-ast = { workspace = true }
wlwl-lexer = { workspace = true }
wlwl-parser = { workspace = true }
wlwl-error = { workspace = true }
wlwl-eval = { workspace = true }
wlwl-formatter = { workspace = true }
wlwl-toml = { workspace = true }
# v0.10 Step 2 (ADR-0020 A3): the compile-time static pass, gated by
# [features] gradual_typing in wlwl.toml.
wlwl-types = { workspace = true }
# [项目扩展 / G-07] `wlwl namespace` 要把**命名空间绑定表**直接列出来 ⇒ 需要
# `wlwl_std::namespace_paths()` / `resolve()` / `lang_exports()`。
# ⚠ 二进制里本来就有它（`wlwl-eval` 依赖它）⇒ **不引入任何新的第三方依赖**。
wlwl-std = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
