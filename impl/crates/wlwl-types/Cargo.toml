[package]
name = "wlwl-types"
version.workspace = true
edition.workspace = true
license.workspace = true  # SPDX canonical: "GPL-2.0-only"
description = "WLWL static type IR, type environment, and type-check diagnostics (compile-time, ADR-0020)"

[dependencies]
wlwl-ast = { workspace = true }
# v0.10 Step 2 (ADR-0020 A3 / decision D-1): the static pass renders
# TypeDiag into WlwlDiagnostic with its own E0110+/W0110+ code segment.
wlwl-error = { workspace = true }
# v0.10 Step 6 (plan §4.1 C1): the module-signature parser feeds each
# declared type through the *real* parser (wrapped in a synthetic
# `LET(__t: <text>, 0);`) so the signature grammar can never drift from
# the annotation grammar. Promote from dev-dependency to a real one --
# this is a layering-legal edge: ADR-0020 forbids `wlwl-eval` <-> this
# crate, and `wlwl-ast` already depends on `wlwl-parser`.
wlwl-parser = { workspace = true }

[dev-dependencies]
wlwl-parser = { path = "../wlwl-parser" }

[lints]
workspace = true
